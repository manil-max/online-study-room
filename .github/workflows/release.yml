name: Release Orchestrator

on:
  push:
    tags: ['beta-v*']
  workflow_dispatch:
    inputs:
      tag: { description: 'Mevcut beta-vNNNN veya vNN tag', required: true, type: string }
      channel: { description: 'Tag ile aynı kanal', required: true, type: choice, options: [beta, stable] }
      expected_git_sha: { description: 'Tam 40 karakter SHA', required: true, type: string }
      expected_migration_head: { description: 'Tam dört haneli migration head', required: true, type: string }
      production_confirmation: { description: 'Stable: PRODUCTION RELEASE GO:<sha>:<head>:<project-ref>', required: false, type: string }
      production_evidence: { description: 'Stable: release kanıtı + varsa sahip muafiyeti/rollback konumu', required: false, type: string }

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' && 'production' || 'staging' }}
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      tag: ${{ steps.meta.outputs.tag }}
      git_sha: ${{ steps.meta.outputs.git_sha }}
      migration_head: ${{ steps.meta.outputs.migration_head }}
      version_name: ${{ steps.meta.outputs.version_name }}
      build_number: ${{ steps.meta.outputs.build_number }}
      environment: ${{ steps.meta.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - id: meta
        shell: pwsh
        # 🔴 WP-666: elle girilen değerler artık koda `${{ }}` ile GÖMÜLMÜYOR,
        # ortam değişkeniyle giriyor. Gömme, değeri PowerShell KAYNAK KODUNUN
        # parçası yapar: içindeki tek tırnak dizeyi kapatır ve kalanı komut
        # olarak çalışır. Bu teorik değil — v65 turu tam bu yüzden `ParserError`
        # ile düştü (kanıt metninde `CI'da` yazıyordu, koşum 31390722795).
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_CHANNEL: ${{ inputs.channel }}
          DISPATCH_HEAD: ${{ inputs.expected_migration_head }}
          DISPATCH_SHA: ${{ inputs.expected_git_sha }}
        run: |
          $dispatch = '${{ github.event_name }}' -eq 'workflow_dispatch'
          $tag = if ($dispatch) { $env:DISPATCH_TAG } else { $env:GITHUB_REF_NAME }
          # 🔴 Etiket biçimi artık İKİ kanalda da TAM eşleşmeyle doğrulanıyor.
          # Eskiden beta dalı `StartsWith('beta-v')` idi: `beta-vX` ile başlayan
          # her şey geçiyor, sonrası hiç sınanmıyordu. Etiket aşağıda başka
          # adımlara aktarılan bir değer, yani biçimi bir sözleşmedir.
          $channel = if ($tag -match '^beta-v\d+$') { 'beta' } elseif ($tag -match '^v\d+$') { 'stable' } else { throw "Geçersiz release tag: $tag" }
          if ($dispatch -and $channel -ne $env:DISPATCH_CHANNEL) { throw 'Seçilen kanal tag ile uyuşmuyor.' }
          $sha = (git rev-parse HEAD).Trim()
          $contract = Get-Content tooling/release/deploy-contract.json -Raw | ConvertFrom-Json
          $head = if ($dispatch) { $env:DISPATCH_HEAD } else { $contract.staging.migration_head }
          $expectedSha = if ($dispatch) { $env:DISPATCH_SHA } else { $sha }
          $code = [int]($tag -replace '^beta-v|^v', '')
          $version = if ($channel -eq 'beta') { "1.0.$([math]::Floor($code / 100))-beta.$($code % 100)" } else { "1.0.$code" }
          "tag=$tag" >> $env:GITHUB_OUTPUT; "channel=$channel" >> $env:GITHUB_OUTPUT; "git_sha=$expectedSha" >> $env:GITHUB_OUTPUT
          "migration_head=$head" >> $env:GITHUB_OUTPUT; "version_name=$version" >> $env:GITHUB_OUTPUT; "build_number=$code" >> $env:GITHUB_OUTPUT
          "environment=$(if ($channel -eq 'beta') { 'staging' } else { 'production' })" >> $env:GITHUB_OUTPUT
      - name: Tek girişli release preflight
        shell: pwsh
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          DEPLOY_APPROVAL_ENVIRONMENT: ${{ steps.meta.outputs.environment }}
          # 🔴 WP-666: sahibin serbest metin olarak yazdığı iki değer. Kanıt
          # metni cümlelerden oluşur ve Türkçede kesme işareti KAÇINILMAZDIR
          # (`CI'da`, `2026-07-27'den`); koda gömülünce dizeyi kapatır.
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
          PRODUCTION_EVIDENCE: ${{ inputs.production_evidence }}
        run: |
          $channel = '${{ steps.meta.outputs.channel }}'; $isBeta = $channel -eq 'beta'
          ./tooling/release/release-preflight.ps1 -Channel $channel -Tag '${{ steps.meta.outputs.tag }}' -ExpectedGitSha '${{ steps.meta.outputs.git_sha }}' -ExpectedMigrationHead '${{ steps.meta.outputs.migration_head }}' -ProjectRef $(if ($isBeta) { $env:STAGING_SUPABASE_PROJECT_REF } else { $env:PRODUCTION_SUPABASE_PROJECT_REF }) -SupabaseUrl $(if ($isBeta) { $env:STAGING_SUPABASE_URL } else { $env:PRODUCTION_SUPABASE_URL }) -StagingProjectRef $env:STAGING_SUPABASE_PROJECT_REF -ProductionProjectRef $env:PRODUCTION_SUPABASE_PROJECT_REF -ProductionConfirmation "$env:PRODUCTION_CONFIRMATION" -ProductionEvidence "$env:PRODUCTION_EVIDENCE"

      # WP-533: v61 stable turu 15 dakikalik derlemenin SONUNDA
      # `processPlayReleaseGoogleServices` adiminda "File
      # google-services.json is missing" ile dustu. `play` flavor'i
      # WP-527'ye kadar hic derlenmemisti, yani eksik dosya hicbir kapida
      # gorunmuyordu. Bu adim ayni eksigi derleme baslamadan, saniyeler
      # icinde yakalar (Gradle/Flutter kurulumu istemez).
      - name: Play flavor Firebase/ikon kaynagi
        run: python3 scripts/test_all.py --internal-play-firebase

  android:
    needs: preflight
    runs-on: ubuntu-latest
    environment: ${{ needs.preflight.outputs.environment }}
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.git_sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 🔴 WP-505: surum PINLI. Pinsizken runner o gunku stable'i
          # kuruyordu ve yerelde uretilen goldenlar alt-piksel farkiyla
          # kirmiziya dusuyordu (olculdu: 288x225 vs 288x224, sonra
          # %4.61 raster farki). Tek kaynak: repo kokundeki
          # `.flutter-version`. Degeri `scripts/test_all.py
          # --internal-flutter-pin` her kosumda dogrular.
          flutter-version: 3.44.2
      - name: İmzalama anahtarını hazırla
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/key.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=key.jks\n' '${{ secrets.STORE_PASSWORD }}' '${{ secrets.KEY_PASSWORD }}' '${{ secrets.KEY_ALIAS }}' > android/key.properties
      - name: Kanal/backend manifestini üret
        shell: bash
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_ANDROID_API_KEY: ${{ vars.FIREBASE_ANDROID_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          if [ '${{ needs.preflight.outputs.channel }}' = beta ]; then ENV=staging; URL="$STAGING_SUPABASE_URL"; KEY="$STAGING_SUPABASE_ANON_KEY"; REF="$STAGING_SUPABASE_PROJECT_REF"; FLAVOR=beta; SRC=app-beta-release.apk; OUT=app-beta-release.apk; else ENV=production; URL="$PRODUCTION_SUPABASE_URL"; KEY="$PRODUCTION_SUPABASE_ANON_KEY"; REF="$PRODUCTION_SUPABASE_PROJECT_REF"; FLAVOR=stable; SRC=app-stable-release.apk; OUT=app-release.apk; fi
          for required in FIREBASE_PROJECT_ID FIREBASE_ANDROID_API_KEY FIREBASE_ANDROID_APP_ID FIREBASE_MESSAGING_SENDER_ID; do
            if [ -z "${!required}" ]; then echo "Missing required environment variable: $required"; exit 1; fi
          done
          python - <<PY
          import json
          json.dump({'CHANNEL':'${{ needs.preflight.outputs.channel }}','APP_ENVIRONMENT':'$ENV','ALLOW_IN_MEMORY':'false','SUPABASE_URL':'$URL','SUPABASE_ANON_KEY':'$KEY','SUPABASE_PROJECT_REF':'$REF','STAGING_SUPABASE_PROJECT_REF':'$STAGING_SUPABASE_PROJECT_REF','PRODUCTION_SUPABASE_PROJECT_REF':'$PRODUCTION_SUPABASE_PROJECT_REF','GIT_COMMIT_SHA':'${{ needs.preflight.outputs.git_sha }}','MIGRATION_HEAD':'${{ needs.preflight.outputs.migration_head }}','APP_VERSION_NAME':'${{ needs.preflight.outputs.version_name }}','APP_BUILD_NUMBER':'${{ needs.preflight.outputs.build_number }}','DISTRIBUTION_CHANNEL':'github','LEGAL_BASE_URL':'https://manil-max.github.io/online-study-room','FIREBASE_PROJECT_ID':'$FIREBASE_PROJECT_ID','FIREBASE_ANDROID_API_KEY':'$FIREBASE_ANDROID_API_KEY','FIREBASE_ANDROID_APP_ID':'$FIREBASE_ANDROID_APP_ID','FIREBASE_MESSAGING_SENDER_ID':'$FIREBASE_MESSAGING_SENDER_ID'}, open('env.json','w'))
          PY
          echo "FLAVOR=$FLAVOR" >> $GITHUB_ENV; echo "SRC=$SRC" >> $GITHUB_ENV; echo "OUT=$OUT" >> $GITHUB_ENV
      - run: flutter pub get
      - run: flutter analyze
      # Golden baseline'ları Windows'ta üretildi; Android runner yalnızca
      # platformdan bağımsız fonksiyonel paketi çalıştırır.
      - run: flutter test --exclude-tags=golden --dart-define-from-file=env.json
      - run: flutter test test/core/current_build_manifest_gate_test.dart --dart-define-from-file=env.json --dart-define=ENFORCE_CURRENT_BUILD_MANIFEST=true
      - run: flutter build apk --release --flavor "$FLAVOR" --build-name=${{ needs.preflight.outputs.version_name }} --build-number=${{ needs.preflight.outputs.build_number }} --dart-define-from-file=env.json
      - name: Android artefaktını paketle
        run: |
          cd build/app/outputs/flutter-apk
          if [ "$SRC" != "$OUT" ]; then mv -- "$SRC" "$OUT"; fi
          test -f "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          python - <<PY
          import hashlib,json,pathlib
          p=pathlib.Path('$OUT'); pathlib.Path('platform-manifest.json').write_text(json.dumps({'schemaVersion':1,'platform':'android','status':'complete','channel':'${{ needs.preflight.outputs.channel }}','gitCommitSha':'${{ needs.preflight.outputs.git_sha }}','migrationHead':'${{ needs.preflight.outputs.migration_head }}','artifacts':[{'name':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}]},indent=2)+'\n')
          PY
      # WP-527: Play Store yeni uygulamada APK degil AAB ister. AAB YALNIZ
      # stable kanalda uretilir; beta GitHub sideload kanalidir ve Play'e girmez.
      #
      # DISTRIBUTION_CHANNEL secimi: env.json'daki deger `github`, Play build'i
      # icin `play` olmalidir. `--dart-define` ile ezmek yerine AYRI dosya
      # uretiliyor -- ayni anahtar hem `--dart-define-from-file` hem
      # `--dart-define` ile verilirse hangisinin kazandigi flutter_tools ic
      # detayidir ve surumle degisebilir; ayri dosyada belirsizlik yok.
      # Asagidaki iddialar iki dosyanin YALNIZ bu anahtarda ayrildigini ve
      # APK'nin env.json'unun bozulmadigini derleme aninda kanitlar.
      - name: Play AAB env dosyasi (DISTRIBUTION_CHANNEL=play)
        if: needs.preflight.outputs.channel == 'stable'
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          base = json.loads(pathlib.Path('env.json').read_text())
          assert base['DISTRIBUTION_CHANNEL'] == 'github', base['DISTRIBUTION_CHANNEL']
          assert base['LEGAL_BASE_URL'], 'LEGAL_BASE_URL Play derlemesinde de zorunlu'
          play = dict(base, DISTRIBUTION_CHANNEL='play')
          pathlib.Path('env.play.json').write_text(json.dumps(play))
          again = json.loads(pathlib.Path('env.json').read_text())
          assert again == base, 'APK env.json Play adimi tarafindan degistirildi'
          drop = lambda d: {k: v for k, v in d.items() if k != 'DISTRIBUTION_CHANNEL'}
          assert drop(play) == drop(base), 'env.play.json tek anahtar disinda ayrilmali'
          PY
      - name: Play AAB derle (yalniz stable)
        if: needs.preflight.outputs.channel == 'stable'
        run: flutter build appbundle --release --flavor play --build-name=${{ needs.preflight.outputs.version_name }} --build-number=${{ needs.preflight.outputs.build_number }} --dart-define-from-file=env.play.json
      # WP-552: izin sozlesmesinin CIKTI katmani, AAB'yi ureten is akisinda
      # kosmuyordu -- yalniz `ci.yml`de vardi ve orada Gradle hic kosmadigi icin
      # her zaman "yalniz kaynak" olcuyordu. Yani GONDERIM-BLOKE sinifinin tek
      # korumasi, gonderilen artefakti hicbir zaman gormuyordu. Olculdu: v61
      # AAB'si READ_MEDIA_* ve USE_EXACT_ALARM tasiyordu ve Play Console surum
      # yayinlamayi durdurdu; ikisi de ancak elle kesfedildi.
      # Bu adim AAB derlemesinin HEMEN ardindan kosar, yani birlestirilmis
      # manifest tazedir; `--require-merged` bayragi cikti katmanini ZORUNLU
      # kilar (yoksa/bayatsa kirmizi duser, sessizce yesil saymaz).
      # WP-567: bu adim artik KARA LISTE degil BEYAZ LISTE olcer. Gonderilen
      # AAB'deki her uses-permission / uses-feature / foregroundServiceType,
      # scripts/test_all.py icindeki PLAY_ALLOWED_* kumelerinde tek satir
      # gerekcesiyle yazili olmak zorunda. Kara liste yalniz ADI KONMUS izinleri
      # goruyordu; bir eklenti guncellemesinin getirdigi BEKLENMEDIK izin sessizce
      # gecerdi ve ancak Play inceleme reddinde ogrenilirdi.
      - name: Play manifest izin sozlesmesi (birlestirilmis cikti + beyaz liste)
        if: needs.preflight.outputs.channel == 'stable'
        run: python3 ../scripts/test_all.py --internal-play-manifest --require-merged
      - name: Play AAB artefaktini paketle
        if: needs.preflight.outputs.channel == 'stable'
        shell: bash
        run: |
          AAB=$(find build/app/outputs/bundle -name '*.aab' -print -quit)
          test -n "$AAB"
          cp -- "$AAB" build/app/outputs/flutter-apk/app-play-release.aab
          cd build/app/outputs/flutter-apk
          test -f app-play-release.aab
          sha256sum app-play-release.aab > app-play-release.aab.sha256
          python - <<'PY'
          import hashlib, json, pathlib
          aab = pathlib.Path('app-play-release.aab')
          manifest = pathlib.Path('platform-manifest.json')
          data = json.loads(manifest.read_text())
          data['artifacts'].append({'name': aab.name, 'sha256': hashlib.sha256(aab.read_bytes()).hexdigest()})
          manifest.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: app/build/app/outputs/flutter-apk/*
          if-no-files-found: error

  windows:
    needs: preflight
    uses: ./.github/workflows/windows-release.yml
    with:
      git_sha: ${{ needs.preflight.outputs.git_sha }}
      channel: ${{ needs.preflight.outputs.channel }}
      version_name: ${{ needs.preflight.outputs.version_name }}
      build_number: ${{ needs.preflight.outputs.build_number }}
      migration_head: ${{ needs.preflight.outputs.migration_head }}
    secrets: inherit

  finalize_android:
    needs: [preflight, android]
    if: needs.preflight.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.preflight.outputs.environment }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-assets/android
      - name: Android-first channel manifesti oluştur
        run: |
          python - <<'PY'
          import json, pathlib
          platform=json.loads(pathlib.Path('release-assets/android/platform-manifest.json').read_text())
          assert platform['platform'] == 'android' and platform['status'] == 'complete'
          manifest={
            'schemaVersion': 1,
            'status': 'complete',
            'channel': '${{ needs.preflight.outputs.channel }}',
            'gitCommitSha': '${{ needs.preflight.outputs.git_sha }}',
            'migrationHead': '${{ needs.preflight.outputs.migration_head }}',
            'requiredPlatforms': ['android'],
            'optionalPlatforms': [{'platform': 'windows', 'status': 'building'}],
            'platforms': [platform],
          }
          pathlib.Path('release-assets/release-manifest.json').write_text(json.dumps(manifest, indent=2)+'\n')
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          prerelease: ${{ needs.preflight.outputs.channel == 'beta' }}
          generate_release_notes: true
          files: |
            release-assets/android/*.apk
            release-assets/android/*.aab
            release-assets/android/*.sha1
            release-assets/android/*.sha256
            release-assets/release-manifest.json
      - name: Tamamlanan Android sürüm bildirimini kuyruğa al
        shell: bash
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          PUSH_DISPATCH_SECRET: ${{ secrets.PUSH_DISPATCH_SECRET }}
        run: |
          [ -n "$PUSH_DISPATCH_SECRET" ] || { echo 'Push dispatcher yapılandırılmadı; bildirim atlandı.'; exit 0; }
          if [ '${{ needs.preflight.outputs.channel }}' = beta ]; then URL="$STAGING_SUPABASE_URL"; KEY="$STAGING_SUPABASE_ANON_KEY"; BODY='Yeni beta sürümü indirilmeye hazır.'; else URL="$PRODUCTION_SUPABASE_URL"; KEY="$PRODUCTION_SUPABASE_ANON_KEY"; BODY='Yeni sürüm indirilmeye hazır.'; fi
          PAYLOAD=$(jq -n --arg event_key '${{ needs.preflight.outputs.tag }}' --arg channel '${{ needs.preflight.outputs.channel }}' --arg version '${{ needs.preflight.outputs.version_name }}' --argjson build_number '${{ needs.preflight.outputs.build_number }}' --arg body "$BODY" '{action:"enqueue_update",event_key:$event_key,channel:$channel,version_name:$version,build_number:$build_number,title:"Odak Kampı güncellendi",body:$body}')
          curl --fail-with-body --silent --show-error -X POST "$URL/functions/v1/dispatch-push" -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' -H "x-push-dispatch-secret: $PUSH_DISPATCH_SECRET" --data "$PAYLOAD"

  release_status:
    if: always()
    needs: [preflight, android, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Tek artefakt durum manifestini yaz
        shell: bash
        run: |
          a='${{ needs.android.result }}'; w='${{ needs.windows.result }}'; p='${{ needs.preflight.result }}'; c='${{ needs.preflight.outputs.channel }}'
          if [ "$p" != success ]; then status=failed; elif [ "$a" = success ]; then status=complete; elif [ "$w" = success ]; then status=partial; else status=failed; fi
          printf '{"schemaVersion":1,"status":"%s","preflight":"%s","android":"%s","windows":"%s"}\n' "$status" "$p" "$a" "$w" > release-status-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-status-manifest
          path: release-status-manifest.json
          if-no-files-found: error

  finalize_complete:
    needs: [preflight, android, windows]
    if: needs.preflight.result == 'success' && needs.android.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.preflight.outputs.environment }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-assets/android
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets/windows
      - name: Complete manifest oluştur
        run: |
          python - <<'PY'
          import json, pathlib
          manifests=[]
          for p in pathlib.Path('release-assets').rglob('platform-manifest.json'): manifests.append(json.loads(p.read_text()))
          assert {m['platform'] for m in manifests} == {'android','windows'}
          pathlib.Path('release-assets/release-manifest.json').write_text(json.dumps({'schemaVersion':1,'status':'complete','channel':'${{ needs.preflight.outputs.channel }}','gitCommitSha':'${{ needs.preflight.outputs.git_sha }}','migrationHead':'${{ needs.preflight.outputs.migration_head }}','platforms':manifests},indent=2)+'\n')
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          prerelease: ${{ needs.preflight.outputs.channel == 'beta' }}
          generate_release_notes: true
          files: |
            release-assets/android/*.apk
            release-assets/android/*.aab
            release-assets/android/*.sha1
            release-assets/android/*.sha256
            release-assets/windows/*.msix
            release-assets/windows/*.zip
            release-assets/windows/*.sha256
            release-assets/release-manifest.json
