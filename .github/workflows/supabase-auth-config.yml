name: Supabase Auth Config

# WP-287 panel adımlarının otomasyonu.
#
# Supabase CLI'nin `config push` komutu TÜM supabase/config.toml'u gönderir; o dosya
# yerel geliştirme için yazılmıştır (site_url = 127.0.0.1:3000) ve uzak projeye
# basılırsa şifre sıfırlamayı düzeltmek yerine tamamen kırar. Bu yüzden burada
# Management API ile YALNIZ dört alan yamalanır:
#   site_url, uri_allow_list, mailer_templates_recovery_content
#   ve — YALNIZ açıkça istenirse — mailer_autoconfirm
# Başka hiçbir auth ayarına dokunulmaz.
#
# 🔴 `mailer_autoconfirm` neden buraya girdi (2026-09-07): production okundu ve
# `mailer_autoconfirm=false` + `custom_smtp_configured=false` +
# `rate_limit_email_sent=2` çıktı. Yani doğrulama postası Supabase'in yerleşik
# test sağlayıcısından gidiyor ve saatte 2 ile sınırlı — PROJE genelinde. Aynı
# saatte üçüncü kez kayıt olan kullanıcı postayı HİÇ almaz: hesabı oluşur,
# giriş yapamaz ve kendi başına çözemez. Kapalı testte bu koruma bir işe
# yaramıyor, yalnızca kayıt akışını kırıyor.
#
# Varsayılan `keep`tir: bu alan ancak açıkça istenirse yazılır, yoksa okunur
# ve raporlanır. Kalıcı çözüm özel SMTP'dir; o gelince `true` geri alınır.
#
# Redirect scheme'leri app/lib/core/config/auth_redirect_config.dart ile birebir
# aynıdır (alt çizgisiz taban + flavor suffix'i).

on:
  workflow_dispatch:
    inputs:
      target:
        description: Hangi Supabase projesi yamalanacak.
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      confirm_production:
        description: >-
          Yalnız target=production için: tam olarak PRODUCTION yaz. Production auth
          yapılandırması ayrı bir ops kapısıdır (.agents/AGENTS.md §2).
        required: false
        default: ''
        type: string
      dry_run:
        description: Yalnız mevcut ayarı oku ve göster, hiçbir şeyi değiştirme.
        required: false
        default: false
        type: boolean
      mailer_autoconfirm:
        description: >-
          E-posta doğrulaması. keep = dokunma (varsayılan) · off = doğrulama
          KAPALI, kayıt anında hesap aktif · on = doğrulama zorunlu (özel SMTP
          gerekir, yoksa saatte 2 posta sınırı kayıt akışını kırar).
        required: false
        default: keep
        type: choice
        options:
          - keep
          - 'off'
          - 'on'

permissions:
  contents: read

concurrency:
  group: supabase-auth-config-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  patch:
    name: Patch ${{ inputs.target }} auth config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ inputs.target == 'production' && vars.PRODUCTION_SUPABASE_PROJECT_REF || vars.STAGING_SUPABASE_PROJECT_REF }}
      EXPECTED_URL: ${{ inputs.target == 'production' && secrets.PRODUCTION_SUPABASE_URL || secrets.STAGING_SUPABASE_URL }}
      TARGET: ${{ inputs.target }}
      CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
      DRY_RUN: ${{ inputs.dry_run }}
      MAILER_AUTOCONFIRM: ${{ inputs.mailer_autoconfirm }}
    steps:
      - name: Verify target contract
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET" = "production" && "$CONFIRM_PRODUCTION" != "PRODUCTION" ]]; then
            echo "Production auth config needs confirm_production=PRODUCTION."
            exit 1
          fi
          for value in SUPABASE_ACCESS_TOKEN PROJECT_REF EXPECTED_URL; do
            [[ -n "${!value}" ]] || { echo "Missing required configuration: $value"; exit 1; }
          done
          [[ "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "Invalid project ref"; exit 1; }
          [[ "$EXPECTED_URL" = "https://$PROJECT_REF.supabase.co" ]] || {
            echo "URL/project ref mismatch for $TARGET"
            exit 1
          }
          echo "Target verified: $TARGET ($PROJECT_REF)"

      # WP-587: bu adim YALNIZ OKUR (PATCH govdesine dokunulmadi). Kayit
      # dogrulama bayraklari buraya eklendi cunku depo bugune kadar
      # "e-posta dogrulamasi acik mi, posta gidebiliyor mu, saatte kac
      # tane" sorularini HIC olcmemisti; kapali testte kullanicilar ayni
      # gun kayit oluyor ve dogrulama postasi gelmezse "hesap var / giris
      # yok" durumu olusuyor. smtp_host basilmaz, yalniz "kurulu mu"
      # turevi basilir.
      - name: Read current auth config
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq '{site_url, uri_allow_list, mailer_otp_length,
                   mailer_autoconfirm, external_email_enabled,
                   rate_limit_email_sent,
                   custom_smtp_configured: ((.smtp_host // "") != ""),
                   confirmation_template_has_link:
                     ((.mailer_templates_confirmation_content // "") | contains("{{ .ConfirmationURL }}")),
                   recovery_template_has_token:
                     ((.mailer_templates_recovery_content // "") | contains("{{ .Token }}"))}' \
            | tee "$RUNNER_TEMP/before.json"

      - name: Patch site_url, redirect allowlist and recovery template
        if: ${{ inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail

          # Tek kaynak: auth_redirect_config.dart. Joker (*) veya üçüncü taraf domain
          # ASLA eklenmez — open-redirect riski.
          allow_list='com.manilmax.onlinestudyroom://login-callback,com.manilmax.onlinestudyroom.beta://login-callback,com.manilmax.onlinestudyroom.local://login-callback'

          # Web karşılama sayfası yok; Site URL'i stable derin bağlantısına çekiyoruz ki
          # redirectTo geçmeyen istemciler de localhost'a değil uygulamaya düşsün.
          site_url='com.manilmax.onlinestudyroom://login-callback'

          jq -n \
            --arg site_url "$site_url" \
            --arg uri_allow_list "$allow_list" \
            '$ARGS.named' > "$RUNNER_TEMP/patch.json"

          curl --fail-with-body --silent --show-error \
            -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/patch.json" \
            --output "$RUNNER_TEMP/patch-response.json" || {
              # Management API doğrulama hatalarını görünür kıl; gövde token içermez.
              echo "Management API rejected the patch:"
              cat "$RUNNER_TEMP/patch-response.json" || true
              exit 1
            }

          echo "Deep link routing patched on $TARGET."

      # 🔴 Ayri adim, ayri kapi: bu alan yalniz `keep` DISINDA bir deger
      # verilirse yazilir. Yonlendirme yamasi her kosumda calisir; bu
      # calismaz. Boylece rutin bir `site_url` tazelemesi kayit akisinin
      # guvenlik ayarini SESSIZCE degistiremez.
      - name: Patch mailer_autoconfirm (only when explicitly requested)
        if: ${{ inputs.dry_run == false && inputs.mailer_autoconfirm != 'keep' }}
        shell: bash
        run: |
          set -euo pipefail

          # `off` = dogrulama KAPALI = mailer_autoconfirm TRUE (Supabase adi
          # tersine okunur: "postayi otomatik onayla").
          if [[ "$MAILER_AUTOCONFIRM" == "off" ]]; then
            autoconfirm=true
          elif [[ "$MAILER_AUTOCONFIRM" == "on" ]]; then
            autoconfirm=false
          else
            echo "::error::Beklenmeyen mailer_autoconfirm degeri: $MAILER_AUTOCONFIRM"
            exit 1
          fi

          # `on` istenirken ozel SMTP yoksa UYAR: yerlesik saglayici saatte 2
          # posta gonderir ve kayit akisi ucuncu kullanicida kirilir.
          smtp_configured="$(curl --fail-with-body --silent --show-error \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq -r '((.smtp_host // "") != "")')"
          if [[ "$autoconfirm" == "false" && "$smtp_configured" != "true" ]]; then
            echo "::warning::$TARGET uzerinde dogrulama ACILIYOR ama ozel SMTP YOK. Yerlesik saglayici saatte 2 posta gonderir (proje geneli); ayni saatte ucuncu kayit postayi hic almaz."
          fi

          jq -n --argjson mailer_autoconfirm "$autoconfirm" '$ARGS.named' \
            > "$RUNNER_TEMP/autoconfirm.json"

          curl --fail-with-body --silent --show-error \
            -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/autoconfirm.json" \
            --output "$RUNNER_TEMP/autoconfirm-response.json" || {
              echo "Management API rejected the autoconfirm patch:"
              cat "$RUNNER_TEMP/autoconfirm-response.json" || true
              exit 1
            }

          echo "mailer_autoconfirm=$autoconfirm patched on $TARGET (istek: $MAILER_AUTOCONFIRM)."

      - name: Patch recovery email template (needs paid plan or custom SMTP)
        if: ${{ inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail

          # {{ .Token }} olmadan Windows/masaüstündeki 6 haneli kod yolu çalışmaz:
          # kod kullanıcıya e-postayla hiç gitmez. Ama Supabase, varsayılan e-posta
          # sağlayıcısını kullanan ÜCRETSİZ projelerde şablon değişikliğini reddeder
          # (panelden de reddeder). O durumda adım uyarıyla geçilir: Android derin
          # bağlantı yolu yine de çalışır, yalnız masaüstü OTP yedeği devre dışı kalır.
          recovery_template='<h2>Şifre sıfırlama</h2>
          <p>Şifreni sıfırlamak için kodun: <strong>{{ .Token }}</strong></p>
          <p>Telefondaysan bu bağlantıya dokunman yeterli: <a href="{{ .ConfirmationURL }}">Şifremi sıfırla</a></p>
          <p>Bu isteği sen yapmadıysan bu e-postayı yok sayabilirsin.</p>'

          jq -n \
            --arg mailer_templates_recovery_content "$recovery_template" \
            '$ARGS.named' > "$RUNNER_TEMP/template.json"

          if curl --fail-with-body --silent --show-error \
            -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/template.json" \
            --output "$RUNNER_TEMP/template-response.json"; then
            echo "Recovery email template patched on $TARGET."
            exit 0
          fi

          message="$(jq -r '.message // ""' "$RUNNER_TEMP/template-response.json" 2>/dev/null || true)"
          if [[ "$message" == *"free tier"* || "$message" == *"custom SMTP"* ]]; then
            echo "::warning::$TARGET serves email from the free-tier default provider, so the recovery template cannot carry {{ .Token }}. Android deep-link reset works; the desktop 6-digit code path stays unavailable until a custom SMTP provider is configured."
            exit 0
          fi

          echo "Management API rejected the template patch:"
          cat "$RUNNER_TEMP/template-response.json" || true
          exit 1

      - name: Verify applied auth config
        if: ${{ inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail
          after="$(curl --fail-with-body --silent --show-error \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"

          printf '%s' "$after" \
            | jq '{site_url, uri_allow_list, mailer_autoconfirm,
                   rate_limit_email_sent,
                   custom_smtp_configured: ((.smtp_host // "") != ""),
                   recovery_template_has_token:
                     ((.mailer_templates_recovery_content // "") | contains("{{ .Token }}")),
                   recovery_template_has_link:
                     ((.mailer_templates_recovery_content // "") | contains("{{ .ConfirmationURL }}"))}' \
            | tee "$RUNNER_TEMP/after.json"

          # Istenen deger GERCEKTEN yazildi mi? Yazma adimi 200 donse bile
          # okunan deger kanittir.
          if [[ "$MAILER_AUTOCONFIRM" != "keep" ]]; then
            want=$([[ "$MAILER_AUTOCONFIRM" == "off" ]] && echo true || echo false)
            printf '%s' "$after" | jq -e --argjson want "$want" \
              '.mailer_autoconfirm == $want' > /dev/null || {
                echo "::error::mailer_autoconfirm istenen degere yazilmadi (istenen: $MAILER_AUTOCONFIRM)."
                exit 1
              }
            echo "Verified: mailer_autoconfirm istenen degerde ($MAILER_AUTOCONFIRM)."
          fi

          # Sert kapı yalnız yönlendirme tarafı: şablon, ücretsiz projelerde
          # değiştirilemediği için kabul kriteri değil (üstteki adım uyarır).
          printf '%s' "$after" | jq -e '
            (.site_url | contains("localhost") or contains("127.0.0.1") | not) and
            (.uri_allow_list | contains("com.manilmax.onlinestudyroom.beta://login-callback")) and
            (.uri_allow_list | contains("*") | not)
          ' > /dev/null

          if printf '%s' "$after" | jq -e '
            (.mailer_templates_recovery_content // "") | contains("{{ .Token }}")
          ' > /dev/null; then
            echo "Verified: $TARGET serves both the deep-link and the 6-digit code reset paths."
          else
            echo "::warning::$TARGET deep-link reset is live, but the recovery email carries no {{ .Token }}, so the desktop code path cannot work yet."
          fi
