name: Staging API Diagnostics

# Read-only: staging'in son 24 saatlik API hata ozetini basar (yol + durum kodu
# + sayi, Postgres hata mesajlari). Repo HERKESE ACIK: cikti yalnizca toplu
# sayidir; UUID, e-posta ve sayilar disindaki tirnakli degerler maskelenir.
# Kisisel veri basilmaz. Production'a bakmaz.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: Kac saat geriye bakilsin (1-24)
        required: false
        default: '24'
        type: string
      restore:
        description: Staging duraklatilmissa geri ac (yalniz staging)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  logs:
    name: Read-only staging API error summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Realtime yayini ve abonelikler (salt okuma SQL)
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/proj && cd /tmp/proj && supabase init --force >/dev/null 2>&1 || true
          supabase link --project-ref "$REF" -p "$SUPABASE_DB_PASSWORD" >/dev/null
          run() { echo "--- $1"; supabase db query --linked "$2" 2>&1 | tail -n +1 | head -60; }
          run "supabase_realtime yayinindaki tablolar" \
            "select schemaname||'.'||tablename as t from pg_publication_tables where pubname='supabase_realtime' order by 1"
          run "yayin var mi / ayarlar" \
            "select pubname, puballtables, pubinsert, pubupdate, pubdelete from pg_publication where pubname='supabase_realtime'"
          run "aktif realtime abonelikleri (tablo, sayi)" \
            "select entity::text as tablo, count(*) as n from realtime.subscription group by 1 order by 2 desc"
          run "group_members / groups replica identity" \
            "select relname, relreplident from pg_class where relname in ('group_members','groups','user_group_preferences') and relnamespace='public'::regnamespace"
          run "group_members RLS select politikalari" \
            "select polname, polcmd from pg_policy where polrelid='public.group_members'::regclass order by 1"

      - name: Query management logs
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$REF" ] || { echo "token/ref yok"; exit 1; }
          H='${{ inputs.hours }}'
          case "$H" in ''|*[!0-9]*) H=24;; esac
          [ "$H" -ge 1 ] && [ "$H" -le 24 ] || H=24
          END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          START=$(date -u -d "-$H hours" +%Y-%m-%dT%H:%M:%SZ)
          mask() { sed -E \
            -e 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/<uuid>/g' \
            -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<email>/g' \
            -e "s/=\([^)]*\)/=(<deger>)/g" \
            -e "s/(eq|neq|gt|gte|lt|lte|like|ilike|in)\.[^&\"]*/\1.<deger>/g"; }
          q() {
            curl -sS -G "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs.all" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --data-urlencode "iso_timestamp_start=$START" \
              --data-urlencode "iso_timestamp_end=$END" \
              --data-urlencode "sql=$1"
          }
          echo "=== Proje durumu ==="
          STATUS=$(curl -sS "https://api.supabase.com/v1/projects/$REF" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '.status // "bilinmiyor"')
          echo "status=$STATUS"
          if [ '${{ inputs.restore }}' = 'true' ] && [ "$STATUS" != "ACTIVE_HEALTHY" ]; then
            echo "Duraklatilmis staging geri aciliyor (restore)..."
            curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/restore" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -o /dev/null -w "restore HTTP %{http_code}\n"
          fi
          echo "=== Beta istemcisinin gordugu uc (anon anahtarla) ==="
          for path in "auth/v1/health" "rest/v1/"; do
            code=$(curl -sS -o /tmp/probe.json -w "%{http_code}" "$STAGING_SUPABASE_URL/$path" \
              -H "apikey: $STAGING_SUPABASE_ANON_KEY" -H "Authorization: Bearer $STAGING_SUPABASE_ANON_KEY" || echo ERR)
            msg=$(jq -r '.message // .msg // .error // empty' /tmp/probe.json 2>/dev/null | head -c 200)
            echo "$path -> HTTP $code ${msg}"
          done
          echo "Pencere: $START .. $END"
          echo "=== Tum trafik (durum, sayi) — sorgu dogrulamasi ==="
          q "select s.status_code as status, count(*) as n
             from edge_logs
             cross join unnest(metadata) as m
             cross join unnest(m.response) as s
             group by status order by n desc limit 20" \
            | jq -r 'if .error then "SORGU HATASI: \(.error|tostring)" else ((.result // []) as $r | if ($r|length)==0 then "(kayit yok)" else ($r[] | "\(.n)\t\(.status)") end) end' | cut -c1-400 || true
          echo "=== En cok cagrilan REST/RPC yollari (yol, sayi) ==="
          q "select r.path as path, count(*) as n
             from edge_logs
             cross join unnest(metadata) as m
             cross join unnest(m.request) as r
             where r.path like '/rest/v1/rpc/%'
             group by path order by n desc limit 25" \
            | jq -r 'if .error then "SORGU HATASI: \(.error|tostring)" else ((.result // []) as $r | if ($r|length)==0 then "(kayit yok)" else ($r[] | "\(.n)\t\(.path)") end) end' | cut -c1-400 | mask || true
          echo "=== REST/RPC 4xx-5xx (yol, durum, sayi) ==="
          q "select r.path as path, s.status_code as status, count(*) as n
             from edge_logs
             cross join unnest(metadata) as m
             cross join unnest(m.request) as r
             cross join unnest(m.response) as s
             where s.status_code >= 400 and r.path like '/rest/v1/%'
             group by path, status order by n desc limit 40" \
            | jq -r 'if .error then "SORGU HATASI: \(.error|tostring)" else ((.result // []) as $r | if ($r|length)==0 then "(kayit yok)" else ($r[] | "\(.n)\t\(.status)\t\(.path)") end) end' | cut -c1-400 | mask || true
          echo "=== Postgres ERROR mesajlari (sayi, mesaj) ==="
          q "select event_message as msg, count(*) as n
             from postgres_logs
             cross join unnest(metadata) as m
             cross join unnest(m.parsed) as p
             where p.error_severity in ('ERROR','FATAL')
             group by msg order by n desc limit 40" \
            | jq -r 'if .error then "SORGU HATASI: \(.error|tostring)" else ((.result // []) as $r | if ($r|length)==0 then "(kayit yok)" else ($r[] | "\(.n)\t\(.msg)") end) end' | cut -c1-300 | mask || true
