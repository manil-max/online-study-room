name: Stable APK Candidate

on:
  workflow_dispatch:
    inputs:
      expected_git_sha:
        description: Exact 40-character main commit SHA to build.
        required: true
        type: string
      expected_migration_head:
        description: Expected four-digit production migration head.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stable-candidate-${{ inputs.expected_git_sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Signed stable APK candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        working-directory: app
    env:
      PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
      PRODUCTION_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_ANDROID_API_KEY: ${{ vars.FIREBASE_ANDROID_API_KEY }}
      FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_git_sha }}
          fetch-depth: 0

      - name: Verify exact candidate contract
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.expected_git_sha }}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" = "${{ inputs.expected_git_sha }}" ]]
          [[ "${{ inputs.expected_migration_head }}" =~ ^[0-9]{4}$ ]]
          [[ "$(jq -r '.production.migration_head' ../tooling/release/deploy-contract.json)" = "${{ inputs.expected_migration_head }}" ]]
          [[ "${{ inputs.expected_migration_head }}" = "0085" ]]
          [[ "$(jq -r '.production.deploy_enabled' ../tooling/release/deploy-contract.json)" = "false" ]]
          [[ "$(jq -r '.production.release_enabled' ../tooling/release/deploy-contract.json)" = "false" ]]

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 🔴 WP-505: surum PINLI. Pinsizken runner o gunku stable'i
          # kuruyordu ve yerelde uretilen goldenlar alt-piksel farkiyla
          # kirmiziya dusuyordu (olculdu: 288x225 vs 288x224, sonra
          # %4.61 raster farki). Tek kaynak: repo kokundeki
          # `.flutter-version`. Degeri `scripts/test_all.py
          # --internal-flutter-pin` her kosumda dogrular.
          flutter-version: 3.44.2

      - name: Prepare signing key
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/key.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=key.jks\n' '${{ secrets.STORE_PASSWORD }}' '${{ secrets.KEY_PASSWORD }}' '${{ secrets.KEY_ALIAS }}' > android/key.properties

      - name: Create production candidate manifest
        shell: bash
        run: |
          set -euo pipefail
          for key in PRODUCTION_SUPABASE_URL PRODUCTION_SUPABASE_ANON_KEY STAGING_SUPABASE_PROJECT_REF PRODUCTION_SUPABASE_PROJECT_REF FIREBASE_PROJECT_ID FIREBASE_ANDROID_API_KEY FIREBASE_ANDROID_APP_ID FIREBASE_MESSAGING_SENDER_ID; do
            [[ -n "${!key}" ]] || { echo "Missing required protected variable: $key"; exit 1; }
          done
          [[ "$PRODUCTION_SUPABASE_URL" = "https://$PRODUCTION_SUPABASE_PROJECT_REF.supabase.co" ]]
          python - <<'PY'
          import json, os
          json.dump({
            'CHANNEL':'stable','APP_ENVIRONMENT':'production','ALLOW_IN_MEMORY':'false',
            'SUPABASE_URL':os.environ['PRODUCTION_SUPABASE_URL'],
            'SUPABASE_ANON_KEY':os.environ['PRODUCTION_SUPABASE_ANON_KEY'],
            'SUPABASE_PROJECT_REF':os.environ['PRODUCTION_SUPABASE_PROJECT_REF'],
            'STAGING_SUPABASE_PROJECT_REF':os.environ['STAGING_SUPABASE_PROJECT_REF'],
            'PRODUCTION_SUPABASE_PROJECT_REF':os.environ['PRODUCTION_SUPABASE_PROJECT_REF'],
            'GIT_COMMIT_SHA':'${{ inputs.expected_git_sha }}',
            'MIGRATION_HEAD':'${{ inputs.expected_migration_head }}',
            'APP_VERSION_NAME':'1.0.49','APP_BUILD_NUMBER':'49','DISTRIBUTION_CHANNEL':'github',
            'FIREBASE_PROJECT_ID':os.environ['FIREBASE_PROJECT_ID'],
            'FIREBASE_ANDROID_API_KEY':os.environ['FIREBASE_ANDROID_API_KEY'],
            'FIREBASE_ANDROID_APP_ID':os.environ['FIREBASE_ANDROID_APP_ID'],
            'FIREBASE_MESSAGING_SENDER_ID':os.environ['FIREBASE_MESSAGING_SENDER_ID'],
          }, open('env.json','w'))
          PY

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --exclude-tags=golden --dart-define-from-file=env.json
      - run: flutter test test/core/current_build_manifest_gate_test.dart --dart-define-from-file=env.json --dart-define=ENFORCE_CURRENT_BUILD_MANIFEST=true
      - run: flutter build apk --release --flavor stable --build-name=1.0.49 --build-number=49 --dart-define-from-file=env.json
      - name: Write public candidate manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          p=pathlib.Path('build/app/outputs/flutter-apk/app-stable-release.apk')
          pathlib.Path('stable-candidate-manifest.json').write_text(json.dumps({
            'schemaVersion':1,'status':'candidate','channel':'stable',
            'gitCommitSha':'${{ inputs.expected_git_sha }}',
            'migrationHead':'${{ inputs.expected_migration_head }}',
            'versionName':'1.0.49','buildNumber':49,
            'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'releasePublished':False
          }, indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stable-apk-candidate-${{ inputs.expected_git_sha }}
          path: |
            app/build/app/outputs/flutter-apk/app-stable-release.apk
            app/stable-candidate-manifest.json
          if-no-files-found: error
