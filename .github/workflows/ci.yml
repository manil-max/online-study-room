name: CI

# 🔴 Bu iş akışının varlık sebebi: `docs/BETA-YAYIN-ARIZA-NIHAI-RAPORU-2026-07-23.md`.
# `beta-v4304` ve `beta-v4305` **APK derlemesi başlamadan**, release job'ının içindeki
# tam test paketinde düştü. Sebep sınıfı: test paketi **yalnız release job'ında**
# koşuyordu, yani `main`'e giren bir kırmızı ancak tag atıldığında görülüyordu —
# sahibin zamanı boşa giden bir yayın turuyla.
#
# Bu kapı aynı komutları (`flutter analyze` + tam `flutter test`) **aynı runner
# ailesinde (ubuntu)** her push'ta koşar. Böylece release job'ı sürpriz görmez.
#
# ℹ️ Golden testler Windows'ta üretildi ve bu iş akışından önce **hiç Linux'ta
# koşmadı** (goldenlar 2026-07-24/25'te eklendi, son başarılı release 07-23).
# Platformlar arası raster farkı goldenları kırabilir; kırarsa doğru çözüm
# goldenları üretildikleri platforma sabitlemek, sayıyı gevşetmek değil.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 🔴 WP-373 (cihaz senkronu WP-341'den beri ölü), WP-449/450 (`p_interval_days`
  # sunucuda yoktu) ve `get_user_study_summary` (WP-152'den beri tanımsız, veri
  # dışa aktarımındaki `summary` hep null) aynı sınıfın üç örneğidir: Dart ucu
  # ile SQL ucu birbirinden habersiz kayıyor. Dart testlerinin tamamı
  # `InMemory*Repository` kullandığı, `Supabase*Repository` sınıflarının hiçbiri
  # hiçbir testte örneklenmediği için kopukluk yeşil kapıların arkasında
  # saklanıyordu. Bu kapı 91 çağrıyı 213 sunucu imzasına karşı doğrular.
  #
  # Saniyeler sürer ve Flutter kurulumu gerektirmez, bu yüzden ayrı ve önce.
  backend-contract:
    name: Dart/Edge ↔ SQL sözleşme kapısı
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sözleşme denetimi
        run: python scripts/backend_contract_audit.py

      # Yeşil bir denetim, denetimin çalıştığını kanıtlamaz. Bu adım geçici
      # olarak tanımsız bir RPC ve olmayan bir sütun ekler, kapının KIRMIZIYA
      # döndüğünü doğrular ve probu siler. Kapı sessizce etkisiz hâle gelirse
      # (regex bozulur, muafiyet fazla genişler) bu adım düşer.
      - name: Kapının gerçekten reddettiğini kanıtla
        run: python scripts/backend_contract_audit.py --self-test

  # 🔴 Altı Edge Function (1601 satır, içinde kullanıcı verisi silen
  # `purge-accounts`) hiçbir yerde tip denetiminden geçmiyordu. Denetim ilk
  # açıldığında **altısı da** düştü; hepsi düzeltildi (yakalananlar: `catch`
  # bloğunda `unknown` üzerinde `error.message` — Error olmayan bir şey
  # fırlatılırsa istemciye boş hata gövdesi gidiyordu).
  #
  # `deno check` derlemenin yaptığı işi CI'a taşır: bu kod sunucuda çalışır,
  # kırıldığında Flutter kapılarının hiçbiri görmez.
  edge-functions:
    name: Edge Function tip denetimi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: deno check (altı fonksiyon)
        run: |
          set -e
          for file in supabase/functions/*/index.ts; do
            echo "::group::$file"
            deno check --no-lock "$file"
            echo "::endgroup::"
          done

  analyze-and-test:
    name: analyze + full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # Testler ağa çıkmaz; `--dart-define-from-file` yalnız dosyanın var olmasını
      # ve iki anahtarı ister. Bu yüzden burada **secret kullanılmıyor** — sahte
      # değerler yeterli, kanal/backend doğrulaması ayrı kapının işi
      # (`current_build_manifest_gate_test.dart`, release job'ında koşar).
      - name: Sahte env.json (secret gerekmez)
        run: |
          cat > env.json <<'JSON'
          {
            "SUPABASE_URL": "http://127.0.0.1:54321",
            "SUPABASE_ANON_KEY": "ci-placeholder-anon-key"
          }
          JSON

      # ⚠️ `flutter analyze` `--dart-define-from-file` bayrağını KABUL ETMEZ
      # (yalnız run/test/build alır). Buraya eklenirse iş akışı anlamsız bir
      # argüman hatasıyla düşer.
      - run: flutter analyze

      # Golden baseline'ları Windows'ta üretildi. Linux raster çıktısı ile
      # karşılaştırmak platform farkını ürün regresyonu diye raporlar.
      #
      # `--coverage` aşağıdaki kapsam ratchet'i için gerekli; testlerin
      # kendisini değiştirmez, yalnız lcov üretir.
      - run: flutter test --exclude-tags=golden --coverage --dart-define-from-file=env.json

      # 🔴 Bu repoda uzun süre HİÇBİR kapsam ölçümü yoktu: 1399 test yeşildi
      # ama hangi kodun hiç çalıştırılmadığı bilinmiyordu. Ratchet yeni kodun
      # testsiz girmesini engeller; eşik yalnız bilerek yükseltilir.
      - name: Kapsam ratchet
        working-directory: .
        run: python scripts/coverage_audit.py

  # 🔴 WP-465 bulgusu: `app/integration_test/v8_critical_flows_test.dart` HİÇBİR
  # kapıda koşmuyordu. `flutter test` varsayılan olarak yalnız `test/` dizinini
  # koşar, yukarıdaki iki iş de öyle; dosyayı sadece elle çalıştırılan
  # `scripts/windows_local_dev.ps1 -IntegrationTest` çağırıyordu. Adı "kritik
  # akışlar" olan bir test yıllardır hiçbir şeyi korumuyordu.
  #
  # Ayrı iş olmasının sebebi: `-d windows` gerçek bir Debug Windows derlemesi
  # yapar (dakikalar sürer). Golden işine eklenseydi hem o işin süresini
  # riske atardı hem de kırmızı düştüğünde hangisinin bozulduğu belirsiz olurdu.
  integration-tests:
    name: Windows integration (critical flows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Sahte env.json (secret gerekmez)
        shell: pwsh
        run: |
          @{
            SUPABASE_URL = 'http://127.0.0.1:54321'
            SUPABASE_ANON_KEY = 'ci-placeholder-anon-key'
          } | ConvertTo-Json | Set-Content -LiteralPath env.json -Encoding utf8
      - run: flutter test -d windows integration_test/v8_critical_flows_test.dart --dart-define-from-file=env.json

  golden-tests:
    name: Windows golden baselines
    runs-on: windows-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Sahte env.json (secret gerekmez)
        shell: pwsh
        run: |
          @{
            SUPABASE_URL = 'http://127.0.0.1:54321'
            SUPABASE_ANON_KEY = 'ci-placeholder-anon-key'
          } | ConvertTo-Json | Set-Content -LiteralPath env.json -Encoding utf8
      - run: flutter test --tags=golden --dart-define-from-file=env.json --concurrency=1
