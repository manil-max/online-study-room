name: CI

# 🔴 Bu iş akışının varlık sebebi: `docs/BETA-YAYIN-ARIZA-NIHAI-RAPORU-2026-07-23.md`.
# `beta-v4304` ve `beta-v4305` **APK derlemesi başlamadan**, release job'ının içindeki
# tam test paketinde düştü. Sebep sınıfı: test paketi **yalnız release job'ında**
# koşuyordu, yani `main`'e giren bir kırmızı ancak tag atıldığında görülüyordu —
# sahibin zamanı boşa giden bir yayın turuyla.
#
# Bu kapı aynı komutları (`flutter analyze` + tam `flutter test`) **aynı runner
# ailesinde (ubuntu)** her push'ta koşar. Böylece release job'ı sürpriz görmez.
#
# ℹ️ Golden testler Windows'ta üretildi ve bu iş akışından önce **hiç Linux'ta
# koşmadı** (goldenlar 2026-07-24/25'te eklendi, son başarılı release 07-23).
# Platformlar arası raster farkı goldenları kırabilir; kırarsa doğru çözüm
# goldenları üretildikleri platforma sabitlemek, sayıyı gevşetmek değil.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 🔴 WP-373 (cihaz senkronu WP-341'den beri ölü), WP-449/450 (`p_interval_days`
  # sunucuda yoktu) ve `get_user_study_summary` (WP-152'den beri tanımsız, veri
  # dışa aktarımındaki `summary` hep null) aynı sınıfın üç örneğidir: Dart ucu
  # ile SQL ucu birbirinden habersiz kayıyor. Dart testlerinin tamamı
  # `InMemory*Repository` kullandığı, `Supabase*Repository` sınıflarının hiçbiri
  # hiçbir testte örneklenmediği için kopukluk yeşil kapıların arkasında
  # saklanıyordu. Bu kapı 91 çağrıyı 213 sunucu imzasına karşı doğrular.
  #
  # Saniyeler sürer ve Flutter kurulumu gerektirmez, bu yüzden ayrı ve önce.
  backend-contract:
    name: Dart/Edge ↔ SQL sözleşme kapısı
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sözleşme denetimi
        run: python scripts/backend_contract_audit.py

      # Yeşil bir denetim, denetimin çalıştığını kanıtlamaz. Bu adım geçici
      # olarak tanımsız bir RPC ve olmayan bir sütun ekler, kapının KIRMIZIYA
      # döndüğünü doğrular ve probu siler. Kapı sessizce etkisiz hâle gelirse
      # (regex bozulur, muafiyet fazla genişler) bu adım düşer.
      - name: Kapının gerçekten reddettiğini kanıtla
        run: python scripts/backend_contract_audit.py --self-test

      # 🔴 Migration head birden fazla yerde pinlidir ve iki turda üst üste biri
      # güncellenmeden commit atıldı; CI aynı yerden kırmızı düştü. Bu adım
      # zincirde boşluk, başlık kuralı ihlali ve kontrat ↔ guard.tests head
      # ayrışmasını saniyeler içinde yakalar.
      - name: Migration zinciri ve head pinleri
        run: python scripts/test_all.py --internal-migration-head

      # 🔴 WP-505: Flutter sürümü **altı** workflow adımında pinlidir ve
      # migration head'in üç yerde kayması gibi burası da kayabilir.
      # Pin kayarsa/silinirse runner o günkü stable'ı kurar; ölçüldü,
      # goldenlar kod hiç değişmeden kırmızıya düşüyor (288×225 vs
      # 288×224, sonra %4.61 raster farkı). Tek kaynak `.flutter-version`.
      - name: Flutter sürümü her workflow'da aynı
        run: python scripts/test_all.py --internal-flutter-pin

      # 🔴 WP-533: `play` flavor'ı v61'e kadar HİÇ derlenmedi, bu yüzden hiç
      # ölçülmedi de. İlk derlendiğinde iki ayrı eksik peş peşe patladı:
      # `google-services.json` yok, sonra `res` dizini yok (`@mipmap/
      # ic_launcher` çözülemiyor). İkisi de 15 dakikalık yayın derlemesinin
      # ortasında görüldü. Bu adım aynı eksikleri saniyeler içinde yakalar.
      - name: Play flavor Firebase ve ikon kaynağı
        run: python scripts/test_all.py --internal-play-firebase

  # 🔴 Altı Edge Function (1601 satır, içinde kullanıcı verisi silen
  # `purge-accounts`) hiçbir yerde tip denetiminden geçmiyordu. Denetim ilk
  # açıldığında **altısı da** düştü; hepsi düzeltildi (yakalananlar: `catch`
  # bloğunda `unknown` üzerinde `error.message` — Error olmayan bir şey
  # fırlatılırsa istemciye boş hata gövdesi gidiyordu).
  #
  # `deno check` derlemenin yaptığı işi CI'a taşır: bu kod sunucuda çalışır,
  # kırıldığında Flutter kapılarının hiçbiri görmez.
  edge-functions:
    name: Edge Function tip denetimi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: deno check (altı fonksiyon)
        run: |
          set -e
          for file in supabase/functions/*/index.ts; do
            echo "::group::$file"
            deno check --no-lock "$file"
            echo "::endgroup::"
          done

      # Tip denetimi kodun derlendiğini söyler, DOĞRU davrandığını söylemez.
      # `purge-accounts` kullanıcı verisini kalıcı olarak siler; yetkilendirme
      # kararının gerçekten fail-closed olduğu burada sınanır.
      #
      # Saf kararlar `_shared/` altında ayrı modülde: `index.ts` en üst
      # seviyede `serve(...)` çağırdığı için test onu import edemez (gerçek
      # sunucu başlar, test asılır).
      - name: deno test (Edge Function karar mantığı)
        run: deno test --no-lock --allow-env supabase/functions/

  analyze-and-test:
    name: analyze + full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 🔴 WP-505: surum PINLI. Pinsizken runner o gunku stable'i
          # kuruyordu ve yerelde uretilen goldenlar alt-piksel farkiyla
          # kirmiziya dusuyordu (olculdu: 288x225 vs 288x224, sonra
          # %4.61 raster farki). Tek kaynak: repo kokundeki
          # `.flutter-version`. Degeri `scripts/test_all.py
          # --internal-flutter-pin` her kosumda dogrular.
          flutter-version: 3.44.2

      - run: flutter pub get

      # Testler ağa çıkmaz; `--dart-define-from-file` yalnız dosyanın var olmasını
      # ve iki anahtarı ister. Bu yüzden burada **secret kullanılmıyor** — sahte
      # değerler yeterli, kanal/backend doğrulaması ayrı kapının işi
      # (`current_build_manifest_gate_test.dart`, release job'ında koşar).
      - name: Sahte env.json (secret gerekmez)
        run: |
          cat > env.json <<'JSON'
          {
            "SUPABASE_URL": "http://127.0.0.1:54321",
            "SUPABASE_ANON_KEY": "ci-placeholder-anon-key"
          }
          JSON

      # ⚠️ `flutter analyze` `--dart-define-from-file` bayrağını KABUL ETMEZ
      # (yalnız run/test/build alır). Buraya eklenirse iş akışı anlamsız bir
      # argüman hatasıyla düşer.
      - run: flutter analyze

      # Golden baseline'ları Windows'ta üretildi. Linux raster çıktısı ile
      # karşılaştırmak platform farkını ürün regresyonu diye raporlar.
      #
      # `--coverage` aşağıdaki kapsam ratchet'i için gerekli; testlerin
      # kendisini değiştirmez, yalnız lcov üretir.
      - run: flutter test --exclude-tags=golden --coverage --dart-define-from-file=env.json

      # 🔴 Bu repoda uzun süre HİÇBİR kapsam ölçümü yoktu: 1399 test yeşildi
      # ama hangi kodun hiç çalıştırılmadığı bilinmiyordu. Ratchet yeni kodun
      # testsiz girmesini engeller; eşik yalnız bilerek yükseltilir.
      - name: Kapsam ratchet
        working-directory: .
        run: python scripts/coverage_audit.py

  # 🔴 WP-465 bulgusu: `app/integration_test/v8_critical_flows_test.dart` HİÇBİR
  # kapıda koşmuyordu. `flutter test` varsayılan olarak yalnız `test/` dizinini
  # koşar, yukarıdaki iki iş de öyle; dosyayı sadece elle çalıştırılan
  # `scripts/windows_local_dev.ps1 -IntegrationTest` çağırıyordu. Adı "kritik
  # akışlar" olan bir test yıllardır hiçbir şeyi korumuyordu.
  #
  # Ayrı iş olmasının sebebi: `-d windows` gerçek bir Debug Windows derlemesi
  # yapar (dakikalar sürer). Golden işine eklenseydi hem o işin süresini
  # riske atardı hem de kırmızı düştüğünde hangisinin bozulduğu belirsiz olurdu.
  integration-tests:
    name: Windows integration (critical flows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 🔴 WP-505: surum PINLI. Pinsizken runner o gunku stable'i
          # kuruyordu ve yerelde uretilen goldenlar alt-piksel farkiyla
          # kirmiziya dusuyordu (olculdu: 288x225 vs 288x224, sonra
          # %4.61 raster farki). Tek kaynak: repo kokundeki
          # `.flutter-version`. Degeri `scripts/test_all.py
          # --internal-flutter-pin` her kosumda dogrular.
          flutter-version: 3.44.2
      - run: flutter pub get
      - name: Sahte env.json (secret gerekmez)
        shell: pwsh
        run: |
          @{
            SUPABASE_URL = 'http://127.0.0.1:54321'
            SUPABASE_ANON_KEY = 'ci-placeholder-anon-key'
          } | ConvertTo-Json | Set-Content -LiteralPath env.json -Encoding utf8
      - run: flutter test -d windows integration_test/v8_critical_flows_test.dart --dart-define-from-file=env.json

  golden-tests:
    name: Windows golden baselines
    runs-on: windows-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 🔴 WP-505: surum PINLI. Pinsizken runner o gunku stable'i
          # kuruyordu ve yerelde uretilen goldenlar alt-piksel farkiyla
          # kirmiziya dusuyordu (olculdu: 288x225 vs 288x224, sonra
          # %4.61 raster farki). Tek kaynak: repo kokundeki
          # `.flutter-version`. Degeri `scripts/test_all.py
          # --internal-flutter-pin` her kosumda dogrular.
          flutter-version: 3.44.2
      - run: flutter pub get
      - name: Sahte env.json (secret gerekmez)
        shell: pwsh
        run: |
          @{
            SUPABASE_URL = 'http://127.0.0.1:54321'
            SUPABASE_ANON_KEY = 'ci-placeholder-anon-key'
          } | ConvertTo-Json | Set-Content -LiteralPath env.json -Encoding utf8
      - run: flutter test --tags=golden --dart-define-from-file=env.json --concurrency=1

  # 🔴 WP-516: Android tarafında HİÇBİR gerçek çalışma zamanı testi yoktu.
  # `integration-tests` işi `-d windows` ile koşar, `android-unit` JVM'de sahte
  # prefs kullanır, `app/android/app/src/androidTest/` boştur. v58'de geri sayım
  # ve pomodoro açılışta çöküyordu (Dart `setInt` → Android `putLong`; native
  # `getInt` okuyunca `ClassCastException` süreci öldürüyordu) ve **18 kapının
  # hiçbiri kırmızı dönmedi.** Bu iş, sayacı gerçek bir Android sürecinde
  # başlatıp durduran tek kapıdır.
  #
  # ⏱️ ~10-15 dk sürer, bu yüzden her PR'da değil; yalnız `main` push'unda ve
  # elle tetiklemede (yayın öncesi tur) koşar.
  #
  # Matris API 30 + 33: v58 çökmesi API sürümüne duyarlıydı (bildirim izni ve
  # foreground service davranışı 33'te farklı).
  android-emulator:
    name: Android emülatör smoke (sayaç)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 33]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 🔴 WP-505: surum PINLI. Pinsizken runner o gunku stable'i
          # kuruyordu ve yerelde uretilen goldenlar alt-piksel farkiyla
          # kirmiziya dusuyordu (olculdu: 288x225 vs 288x224, sonra
          # %4.61 raster farki). Tek kaynak: repo kokundeki
          # `.flutter-version`. Degeri `scripts/test_all.py
          # --internal-flutter-pin` her kosumda dogrular.
          flutter-version: 3.44.2

      # KVM olmadan emülatör yazılım emülasyonuna düşer ve boot süresi
      # 10 dk'yı aşar. `-no-snapshot` yine de veriliyor: snapshot geri
      # yüklenirse test bayat bir prefs durumuyla açılabilir.
      - name: KVM erişimi
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # APK derlemesi `validateLocalEnvironment` Gradle kapısından geçer:
      # `local` flavor için CHANNEL/APP_ENVIRONMENT/GIT_COMMIT_SHA/MIGRATION_HEAD
      # zorunludur. Bu yüzden diğer işlerdeki iki anahtarlık sahte env.json
      # yetmez; şablonun kendisi kopyalanır (yeni bir literal pin doğmasın).
      # Secret gerekmez: `ALLOW_IN_MEMORY=true` + boş Supabase alanları.
      - name: Sahte env.json (local flavor; secret gerekmez)
        working-directory: app
        run: cp env.local.example.json env.json

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Emülatörde sayaç smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: app
          # `set -e` YOK: kırmızıyı yutmadan logcat'i toplayabilmek için çıkış
          # kodu elle taşınır. Aksi hâlde test düştüğünde crash tamponu hiç
          # okunmaz ve asıl kanıt kaybolur.
          script: |
            # 🔴 Bu blok `sh -c` ile kosar (action boyle cagiriyor), bash ile DEGIL.
            # `set -o pipefail` bir bashism'dir ve dash'te "Illegal option" ile
            # ANINDA duser: v60 turunda iki matris kolonu da (API 30 + 33) ilk
            # satirda oldu, yani smoke CI'da HIC kosmadi -- kapi vardi, hicbir sey
            # olcmuyordu. `set -u` POSIX'tir. pipefail'in korudugu tek yer cihaz
            # kesfiydi; o artik acik bir bos kontrolle korunuyor.
            set -u
            LOG_DIR="$GITHUB_WORKSPACE/emulator-logs"
            mkdir -p "$LOG_DIR"
            CRASH_LOG="$LOG_DIR/crash-api${{ matrix.api-level }}.log"
            DEVICE="$(adb devices | awk '/\tdevice$/ {print $1; exit}')"
            if [ -z "$DEVICE" ]; then
              echo "::error::adb hicbir hazir cihaz bildirmedi; emulator boot etmemis."
              exit 1
            fi
            echo "Cihaz: $DEVICE"
            adb logcat -c
            status=0
            # 🔴 APK once derlenip `install -g` (tum runtime izinleri ver) ile
            # kurulur, sonra test kosar. Sebebi olculdu: API 33'te ilk `Baslat`
            # POST_NOTIFICATIONS diyalogunu acar, kimse dokunmadigi icin diyalog
            # ekranda kalir ve ikinci `Baslat`
            # `PlatformException(permissionRequestInProgress)` firlatir — kapi
            # sayacla ilgisi olmayan bir sebeple kirmizi duserdi. `flutter test`
            # ayni APK'yi yeniden kurar; `-r` runtime izinlerini korur.
            flutter build apk --debug --flavor local \
              --dart-define-from-file=env.json || status=$?
            if [ $status -eq 0 ]; then
              adb -s "$DEVICE" install -r -t -g \
                build/app/outputs/flutter-apk/app-local-debug.apk || status=$?
            fi
            if [ $status -eq 0 ]; then
              flutter test -d "$DEVICE" --flavor local \
                integration_test/android_timer_smoke_test.dart \
                --dart-define-from-file=env.json || status=$?
            fi
            adb logcat -b crash -d > "$CRASH_LOG" || true
            adb logcat -d -s flutter:V AndroidRuntime:E > "$LOG_DIR/flutter-api${{ matrix.api-level }}.log" || true
            # Sessiz geçme yok: süreç çökmüşse `flutter test` bazen yalnız
            # "Lost connection" der ve kök neden yalnız crash tamponundadır.
            if grep -q 'ClassCastException' "$CRASH_LOG"; then
              echo "::error::logcat crash tamponunda ClassCastException var — v58 sınıfı Dart↔native prefs tip kayması."
              status=1
            fi
            if grep -q 'com.manilmax.online_study_room' "$CRASH_LOG"; then
              echo "::error::Uygulama süreci logcat crash tamponuna düştü."
              status=1
            fi
            exit $status

      - name: logcat artefaktı
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat-api${{ matrix.api-level }}
          path: emulator-logs/
          if-no-files-found: warn
