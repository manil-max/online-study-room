name: Production Purge Activation

# 🔴 Bu is akisinin varlik sebebi (WP-524): `staging-purge-activation.yml`
# 2026-07-31'de purge zincirini YALNIZ staging'de bagladi. Production'da
# `0113` cron'u migration'la birlikte kuruldu (head 0123 > 0113), ama
# `configure_purge` HIC CAGRILMADI ve `purge-accounts` production'a HIC
# deploy edilmedi. Yani production'da bir kullanici "hesabimi sil" derse
# satir `scheduled` yazilir, 14 gun gecer ve **hicbir sey silinmez** --
# staging'de kapatilan hatanin aynisi production'da acik duruyordu.
#
# Bu ayni zamanda Play "veri silme" beyaninin on sartidir: formda "hesap ve
# veriler silinir" demeden once silmenin gercekten kostugunu olcmek gerekir.
#
# ⚠️ Bu is akisi HICBIR HESABI SILMEZ. Dogrulama cagrisi `dry_run` ile yapilir.
# Saglik iddiasi bilerek `configuration_status == "configured"` uzerinedir:
# yapilandirilmamis bir kuyruk sifir hata uretir ve "saglikli" gorunur.

on:
  workflow_dispatch:
    inputs:
      expected_git_sha:
        description: Aktive edilecek tam main commit SHA'sı.
        required: true
        type: string

permissions:
  contents: read

jobs:
  activate:
    name: Deploy production account purge worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
      PRODUCTION_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      EXPECTED_GIT_SHA: ${{ inputs.expected_git_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact production activation contract
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_GIT_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "expected_git_sha must be a full SHA"
            exit 1
          }
          [[ "$GITHUB_SHA" = "$EXPECTED_GIT_SHA" ]] || {
            echo "The checked-out commit does not match expected_git_sha"
            exit 1
          }
          for value in \
            SUPABASE_ACCESS_TOKEN PRODUCTION_SUPABASE_URL \
            PRODUCTION_SUPABASE_ANON_KEY PRODUCTION_SUPABASE_PROJECT_REF; do
            [[ -n "${!value}" ]] || {
              echo "Missing required production configuration: $value"
              exit 1
            }
          done
          [[ "$PRODUCTION_SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || {
            echo "Invalid production project ref"
            exit 1
          }
          [[ "$PRODUCTION_SUPABASE_URL" = "https://$PRODUCTION_SUPABASE_PROJECT_REF.supabase.co" ]] || {
            echo "Production URL/project ref mismatch"
            exit 1
          }
          # Purge zinciri 0113 + 0114 gerektirir; sözleşme production'in gerçekten
          # o head'te olduğunu söylemiyorsa aktivasyon anlamsızdır.
          head="$(python3 -c "import json;print(json.load(open('tooling/release/deploy-contract.json'))['production']['migration_head'])")"
          [[ "$head" > "0112" ]] || {
            echo "Production migration head $head predates the purge chain (0113/0114)."
            exit 1
          }
          echo "Production purge activation contract verified (production head $head)."

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # 🔴 `CRON_SECRET` KULLANILMIYOR. O değişkeni `collect-reports` ve
      # `send-report` paylaşıyor ve `0035`teki aylık rapor cron'u onu
      # `app.settings.cron_secret` DB ayarından gönderiyor. Üstüne yazsaydık
      # rapor cron'u sessizce 401 almaya başlardı. Purge kendi değişkenini
      # kullanır ve secret bu koşumda üretilip iki yere birden (Edge ortamı ve
      # `0113` runtime config) atomik yazılır; başka hiçbir yerde saklanmaz.
      - name: Generate and set the purge-only Edge secret
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secret="$(openssl rand -base64 48 | tr -d '\n=+/' | cut -c1-56)"
          echo "::add-mask::$secret"
          secret_file="$RUNNER_TEMP/odak-kampi-production-purge.env"
          printf 'PURGE_CRON_SECRET=%s\n' "$secret" > "$secret_file"
          trap 'rm -f "$secret_file"' EXIT
          supabase secrets set \
            --project-ref "$PRODUCTION_SUPABASE_PROJECT_REF" \
            --env-file "$secret_file"
          printf 'PURGE_CRON_SECRET=%s\n' "$secret" >> "$GITHUB_ENV"

      - name: Deploy production purge worker
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy purge-accounts \
            --project-ref "$PRODUCTION_SUPABASE_PROJECT_REF" \
            --use-api \
            --no-verify-jwt

      - name: Configure private purge runtime
        shell: bash
        run: |
          set -euo pipefail
          # Taze Edge deploy'ları rota ısınırken kısa süre 503 dönebiliyor.
          # Yalnız bu idempotent yapılandırma çağrısı yeniden denenir; hiçbir
          # hesap silinmez.
          configured=false
          for attempt in {1..12}; do
            if response="$(curl --fail-with-body --silent --show-error \
              -X POST "$PRODUCTION_SUPABASE_URL/functions/v1/purge-accounts" \
              -H "Authorization: Bearer $PRODUCTION_SUPABASE_ANON_KEY" \
              -H 'Content-Type: application/json' \
              -H "x-cron-secret: $PURGE_CRON_SECRET" \
              --data '{"action":"configure_purge"}')" \
              && printf '%s' "$response" | jq -e '.configured == true' >/dev/null; then
              configured=true
              break
            fi
            echo "Purge route is not ready yet (attempt $attempt/12); retrying."
            sleep 5
          done
          [[ "$configured" = true ]] || {
            echo "Purge configuration did not succeed after its readiness window."
            exit 1
          }

      - name: Verify scheduler health is configured (no account is deleted)
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -X POST "$PRODUCTION_SUPABASE_URL/functions/v1/purge-accounts" \
            -H "Authorization: Bearer $PRODUCTION_SUPABASE_ANON_KEY" \
            -H 'Content-Type: application/json' \
            -H "x-cron-secret: $PURGE_CRON_SECRET" \
            --data '{"action":"purge_health"}')"
          # 🔴 Asıl iddia: `not_configured` DEĞİL. Yapılandırılmamış bir kuyruk
          # sıfır hata üretir ve sağlıklı görünür; ayrımı yapan tek alan bu.
          printf '%s' "$response" | jq -e '.health.configuration_status == "configured"' >/dev/null
          printf '%s' "$response" | jq -e '
            (.health.due_count | type == "number") and
            (.health.processing_count | type == "number") and
            (.health.stale_lease_count | type == "number") and
            (.health.terminal_failed_count | type == "number") and
            (.health.purged_last_30d | type == "number")' >/dev/null
          echo "Production purge scheduler health:"
          printf '%s' "$response" | jq -c '.health'

      - name: Dry-run the worker end to end (still deletes nothing)
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -X POST "$PRODUCTION_SUPABASE_URL/functions/v1/purge-accounts" \
            -H "Authorization: Bearer $PRODUCTION_SUPABASE_ANON_KEY" \
            -H 'Content-Type: application/json' \
            -H "x-cron-secret: $PURGE_CRON_SECRET" \
            --data '{"dry_run":true,"limit":5}')"
          printf '%s' "$response" | jq -e '.dry_run == true and (.processed | type == "number")' >/dev/null
          echo "Production purge dry-run:"
          printf '%s' "$response" | jq -c '{processed, dry_run, message}'
          echo "Production purge activation verified."
