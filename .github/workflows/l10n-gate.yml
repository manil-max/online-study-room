name: l10n Gate

# WP-294: denetim vardı ama CI'da koşmuyordu, yani yeni gömülü metin engellenmiyordu.
# Bu kapı `scripts/l10n_audit.py`'yi zorunlu hâle getirir:
#   - dört katalog (EN/TR/DE/AR) anahtar + placeholder eşliği,
#   - kullanıcı yuvalarına gömülü TR/EN metin,
#   - native Android strings/layout yüzeyi (`scripts/l10n_android_audit.py`).
#
# ℹ️ Ubuntu runner UTF-8 olduğu için cp1254 çökmesi burada görünmüyordu; kapı
# yine de `PYTHONIOENCODING` ile açık şekilde UTF-8'e sabitlenir ki Windows
# release runner'ına bağlanırsa davranış değişmesin.

on:
  pull_request:
    paths:
      - 'app/lib/**'
      - 'app/android/app/src/main/res/**'
      - 'scripts/l10n_audit.py'
      - 'scripts/l10n_android_audit.py'
      - '.github/workflows/l10n-gate.yml'
  push:
    branches: [main]
    paths:
      - 'app/lib/**'
      - 'app/android/app/src/main/res/**'
      - 'scripts/l10n_audit.py'
      - 'scripts/l10n_android_audit.py'
      - '.github/workflows/l10n-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l10n-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Catalog parity and hardcoded-string gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: l10n audit (four catalogs + hardcoded strings + native)
        run: python scripts/l10n_audit.py

      - name: Prove the gate actually rejects a new hardcoded string
        # 🔴 Yeşil bir denetim, denetimin çalıştığını kanıtlamaz. Bu adım kapıya
        # geçici gömülü metinler yazdırır ve **kırmızıya döndüğünü** doğrular.
        #
        # WP-500: prob buradaki tek satırlık `Text('This label…')` idi ve tam da
        # bu yüzden kapının kör noktasını göremedi — o satır WP-294'ten beri
        # zaten yakalanıyordu. `'${active.length} aktif'` biçimindeki
        # **değişkenle başlayan** cümle ise iki kuralın kesişiminde denetim
        # dışıydı ve İngilizce arayüzde Türkçe metin olarak yayına çıktı.
        #
        # Prob artık betiğin kendi içinde (`--self-test`), kuralların yanında
        # duruyor ve üç ayrı kör noktayı birden sınıyor; ayrıca ayıraç
        # birleştiren literalin **yanlış pozitif üretmediğini** de doğruluyor.
        # `backend_contract_audit.py --self-test` ile aynı desen.
        run: python scripts/l10n_audit.py --self-test
