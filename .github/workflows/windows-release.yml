name: Windows Release Artifact

on:
  workflow_call:
    inputs:
      git_sha: { required: true, type: string }
      channel: { required: true, type: string }
      version_name: { required: true, type: string }
      build_number: { required: true, type: string }
      migration_head: { required: true, type: string }
  # 🔴 WP-665: bu iş yalnız `workflow_call` ile koşuyordu, yani Windows
  # paketini almanın TEK yolu yeni bir sürüm kesmekti. Paketlemeyi ilgilendiren
  # bir düzeltme uygulamanın koduna hiç dokunmasa bile sürüm numarası yakmak
  # gerekiyordu — WP-664 tam olarak buydu: mağaza paketi v65 etiketinden
  # alınamıyordu çünkü etiket düzeltmeyi taşımıyordu.
  #
  # Elle koşum yayın YAPMAZ ve bu kasıtlıdır: bu dosyada GitHub Release
  # yayınlayan bir adım yoktur, üretilen her şey artefakt olarak kalır.
  # Release'i yalnız `release.yml` bağlar. Yani buradaki tetikleyici sürüm
  # kapılarını atlatmıyor; atlatabileceği bir yayın adımı yok.
  #
  # 🔴 O eylemin ADI buraya yazılamaz: hem bu dosyanın sözleşme testi hem
  # `tooling/supabase/guard.tests.ps1` dosyayı HAM metin olarak arar, yani
  # eylemi anan bir YORUM bile iki kapıyı birden kırmızıya düşürür.
  workflow_dispatch:
    inputs:
      git_sha: { required: true, type: string }
      channel: { required: true, type: string }
      version_name: { required: true, type: string }
      build_number: { required: true, type: string }
      migration_head: { required: true, type: string }

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    environment: ${{ inputs.channel == 'beta' && 'staging' || 'production' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 🔴 WP-505: surum PINLI. Pinsizken runner o gunku stable'i
          # kuruyordu ve yerelde uretilen goldenlar alt-piksel farkiyla
          # kirmiziya dusuyordu (olculdu: 288x225 vs 288x224, sonra
          # %4.61 raster farki). Tek kaynak: repo kokundeki
          # `.flutter-version`. Degeri `scripts/test_all.py
          # --internal-flutter-pin` her kosumda dogrular.
          flutter-version: 3.44.2
          cache: true

      # 🔴 WP-614: bu adim env.json'dan ONCEye alindi ve sirasi artik
      # SOZLESMEDIR. `DISTRIBUTION_CHANNEL` bir derleme-zamani define'idir;
      # Store paketinin magaza kanali olarak isaretlenebilmesi ancak Store
      # modunun env.json yazilmadan ONCE bilinmesiyle mumkun. Eskiden Store
      # karari burada, define ise yukarida veriliyordu: sonuc, magazadan
      # kurulan pakette sideload updater'in ACIK kalmasiydi.
      # 🔴 WP-568: Windows paket surumu iki ayri yerde yaziliyordu. Paket
      # surumu `1.0.0.<build>` SABIT onekiyle uretiliyordu: kullanici "Yuklu
      # uygulamalar"da 1.0.0.62 gorurken uygulama 1.0.62 diyordu; ustelik
      # MSIX'in dorduncu alani Store gonderiminde 0 olmak zorunda oldugu icin o
      # sema Store'a hic gonderilemezdi. Artik tek turetme var ve `version_name`
      # ile `build_number` BIRBIRINI dogruluyor; ayrisirlarsa is paketleme
      # baslamadan durur.
      - name: MSIX kimlik ve sürüm sözleşmesi
        id: msix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $channel = '${{ inputs.channel }}'
          $versionName = '${{ inputs.version_name }}'
          $build = [int]'${{ inputs.build_number }}'
          if ($channel -eq 'beta') {
            if ($versionName -notmatch '^1\.0\.(\d+)-beta\.(\d+)$') { throw "Beta sürüm adı 1.0.<patch>-beta.<sıra> olmalı: $versionName" }
            $patch = [int]$Matches[1]; $sequence = [int]$Matches[2]
            # AGENTS.md §4.1: beta build numarası patch*100 + sıra.
            if ($build -ne ($patch * 100 + $sequence)) { throw "Beta build numarası sürüm adıyla uyuşmuyor: $build vs $versionName" }
            $version = "1.0.$patch.$sequence"
            # 🔴 Beta ve stable Android'de AYRI applicationId kullanıyor
            # (AGENTS.md §4.1) ama Windows'ta ikisi de `OdakKampi.App` kimliğiyle
            # paketleniyordu. Aynı kimlik = Windows için aynı uygulama: beta
            # kurulumu stable'ı sessizce eziyordu, üstelik beta paket sürümü
            # (build 4202) stable'ınkinden (build 62) yüksek kaldığı için
            # kullanıcı bir daha stable'a dönemiyordu.
            $identity = 'OdakKampi.App.Beta'
          } else {
            if ($versionName -notmatch '^1\.0\.(\d+)$') { throw "Stable sürüm adı 1.0.<patch> olmalı: $versionName" }
            $patch = [int]$Matches[1]
            if ($build -ne $patch) { throw "Stable build numarası sürüm adıyla uyuşmuyor: $build vs $versionName" }
            $version = "1.0.$patch.0"
            # Yayınlanmış stable kimliği kalıcıdır (docs/WINDOWS-RELEASE-GATE.md).
            $identity = 'OdakKampi.App'
          }
          # 🔴 WP-597 — MICROSOFT STORE YOLU.
          # Store'a gönderilen MSIX'i sertifikasyondan sonra MICROSOFT kendi
          # sertifikasıyla yeniden imzalar; yani Store yolunda kod imzalama
          # sertifikası SATIN ALMAYA GEREK YOK (sertifika yalnız Store DIŞI
          # dağıtım/sideload için gerekir). Store geliştirici kaydı da artık
          # ücretsiz. Ayrıntı: docs/WINDOWS-STORE-YOLU.md
          #
          # Üç değer de Partner Center'daki uygulamadan gelir ve HEPSİ birden
          # verilmelidir. Yarım yapılandırma sessizce Partner Center'ın
          # reddedeceği bir paket üretirdi; o yüzden fail-closed.
          $storeIdentity = '${{ vars.MSIX_STORE_IDENTITY_NAME }}'
          $storePublisher = '${{ vars.MSIX_STORE_PUBLISHER }}'
          $storeDisplay = '${{ vars.MSIX_STORE_PUBLISHER_DISPLAY_NAME }}'
          # 🔴 WP-664 — DÖRDÜNCÜ DEĞER: REZERVE EDİLMİŞ UYGULAMA ADI.
          # Partner Center, paketin içindeki uygulama adının orada REZERVE
          # EDİLMİŞ bir adla birebir aynı olmasını şart koşar; değilse gönderim
          # "The name found in the package is not one of your reserved app
          # names" ile reddedilir. Bu ad, uygulamanın kod içinde taşıdığı
          # görünen adla AYNI ŞEY DEĞİL: mağazada rezerve edilen ad ayrı bir
          # Partner Center verisidir, o yüzden diğer üçü gibi değişkenden gelir
          # (koda gömülmesi, mağaza tarafı değişince sessizce ayrışmak demek).
          $storeAppName = '${{ vars.MSIX_STORE_DISPLAY_NAME }}'
          $storeParts = @($storeIdentity, $storePublisher, $storeDisplay, $storeAppName)
          $storeSet = @($storeParts | Where-Object { $_ }).Count
          if ($storeSet -gt 0 -and $storeSet -lt 4) {
            throw "Store yapılandırması YARIM: MSIX_STORE_IDENTITY_NAME / MSIX_STORE_PUBLISHER / MSIX_STORE_PUBLISHER_DISPLAY_NAME / MSIX_STORE_DISPLAY_NAME değişkenlerinin DÖRDÜ birden dolu olmalı ($storeSet/4 dolu)."
          }
          # Store paketleri kanaldan bağımsız değildir: beta kanalı Store'a
          # gönderilmiyor (sahip kararı: beta atlanır), o yüzden yalnız stable.
          $storeMode = ($storeSet -eq 4) -and ($channel -eq 'stable')
          if ($storeMode) {
            if ($storePublisher -notmatch '^CN=') { throw "MSIX_STORE_PUBLISHER Partner Center'daki Publisher ID olmalı ve 'CN=' ile başlamalı: $storePublisher" }
            Write-Host "Store modu AÇIK: kimlik=$storeIdentity yayıncı=$storePublisher"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "identity=$identity" >> $env:GITHUB_OUTPUT
          "prefix=odak-kampi-windows-$channel" >> $env:GITHUB_OUTPUT
          "store_mode=$($storeMode.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "store_identity=$storeIdentity" >> $env:GITHUB_OUTPUT
          "store_publisher=$storePublisher" >> $env:GITHUB_OUTPUT
          "store_display=$storeDisplay" >> $env:GITHUB_OUTPUT
          "store_app_name=$storeAppName" >> $env:GITHUB_OUTPUT
          Write-Host "MSIX kimlik=$identity sürüm=$version"

      # 🔴 WP-614 — DAGITIM KANALI. Bu manifest **sideload/ZIP** derlemesini
      # tanimlar: GitHub Releases'tan inen tasinabilir ZIP guncelleme
      # kontrolunu yapmaya devam eder. Magaza paketi AYRI derlenir (asagida);
      # ikisini tek derlemeden cikarmak, birinin politikasini otekine
      # dayatmak demekti.
      - name: Kanal/backend manifestini üret (sideload/ZIP derlemesi)
        shell: pwsh
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
        run: |
          $isBeta = '${{ inputs.channel }}' -eq 'beta'
          $manifest = @{
            CHANNEL = '${{ inputs.channel }}'
            APP_ENVIRONMENT = if ($isBeta) { 'staging' } else { 'production' }
            ALLOW_IN_MEMORY = 'false'
            SUPABASE_URL = if ($isBeta) { $env:STAGING_SUPABASE_URL } else { $env:PRODUCTION_SUPABASE_URL }
            SUPABASE_ANON_KEY = if ($isBeta) { $env:STAGING_SUPABASE_ANON_KEY } else { $env:PRODUCTION_SUPABASE_ANON_KEY }
            SUPABASE_PROJECT_REF = if ($isBeta) { $env:STAGING_SUPABASE_PROJECT_REF } else { $env:PRODUCTION_SUPABASE_PROJECT_REF }
            STAGING_SUPABASE_PROJECT_REF = $env:STAGING_SUPABASE_PROJECT_REF
            PRODUCTION_SUPABASE_PROJECT_REF = $env:PRODUCTION_SUPABASE_PROJECT_REF
            GIT_COMMIT_SHA = '${{ inputs.git_sha }}'
            MIGRATION_HEAD = '${{ inputs.migration_head }}'
            APP_VERSION_NAME = '${{ inputs.version_name }}'
            APP_BUILD_NUMBER = '${{ inputs.build_number }}'
            # Sideload kanali: updater ACIK olmali (ZIP kullanicisi guncellemeyi
            # baska yerden alamaz). Magaza paketi bu degeri KULLANMAZ.
            DISTRIBUTION_CHANNEL = 'windows'
          }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath env.json -Encoding utf8

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --exclude-tags=golden --dart-define-from-file=env.json --concurrency=1
      - run: flutter test --tags=golden --dart-define-from-file=env.json --concurrency=1
      # 🔴 WP-614: guard'a ikinci dosya eklendi. `distribution_channel.dart`
      # yillardir "Faz H'de build oncesi bir kapi testi sarttir" diye yaziyordu
      # ve o kapi hic yazilmamisti. Artik derlemeye giren `DISTRIBUTION_CHANNEL`
      # define'i BILINEN bir deger olmak zorunda; magaza kanaliysa sideload
      # updater'in kapali oldugu ayrica olculuyor. Yanlis yazilmis bir define
      # (ornegin `microsoft-store`) eskiden sessizce `windows`a dusuyordu.
      - name: Kanal/backend + dağıtım kanalı fail-closed guard
        run: flutter test test/core/current_build_manifest_gate_test.dart test/core/config/distribution_define_wp614_test.dart --dart-define-from-file=env.json --dart-define=ENFORCE_CURRENT_BUILD_MANIFEST=true
      - name: Windows derlemesi (sideload/ZIP)
        run: flutter build windows --release --build-name=${{ inputs.version_name }} --build-number=${{ inputs.build_number }} --dart-define-from-file=env.json

      # 🔴 WP-614: ZIP artik burada, MSIX'ten ONCE uretiliyor. Sebep magaza
      # paketinin AYRI bir derleme olmasi: Store derlemesi ayni Release
      # klasorunu ezer, dolayisiyla sideload ZIP o ezilmeden alinmali.
      - name: Taşınabilir ZIP'i sideload derlemesinden üret
        id: zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'build/windows-dist'; New-Item -ItemType Directory -Force -Path $out | Out-Null
          $release = 'build/windows/x64/runner/Release'
          $prefix = '${{ steps.msix.outputs.prefix }}'
          # 🔴 `msix:create` paketi Release klasörünün İÇİNE yazar. ZIP
          # eskiden klasörü olduğu gibi sıkıştırdığı için taşınabilir arşiv kendi
          # kurulumunun bir kopyasını taşıyordu (gereksiz ~2x indirme).
          $zipItems = Get-ChildItem -Path $release | Where-Object { $_.Extension -ne '.msix' }
          if (-not $zipItems) { throw 'Release klasöründe paketlenecek dosya yok.' }
          # 🔴 WP-590: taşınabilir ZIP KOŞULSUZ üretilir ve yayınlanır —
          # kullanıcıda gerçekten çalışan tek Windows artefaktı odur.
          $zipOut = Join-Path $out "$prefix.zip"; Compress-Archive -Path $zipItems.FullName -DestinationPath $zipOut -Force
          "zip=$zipOut" >> $env:GITHUB_OUTPUT
          Write-Host "Taşınabilir ZIP: $zipOut"

      # 🔴 WP-614 — YAYINLANAN ZIP HIC CALISTIRILMIYORDU.
      # `scripts/windows_fast_smoke.ps1` (pencere basligini dogrulayan gercek
      # smoke) repoda duruyor ama HICBIR is akisindan ve `test_all.py`'den
      # cagrilmiyordu: kullaniciya gonderilen arsiv bir kez bile acilmadan
      # yayinlaniyordu. Bu adim ZIP'i ACAR ve icinden cikan EXE'yi calistirir.
      #
      # NE OLCULUYOR: arsiv butunlugu + surecin ayakta kalmasi + Dart masaustu
      # kurulumuna gercekten ULASILDIGI (pencere basligi native bootstrap
      # degerinde kalirsa yapilandirma hata ekranindayiz demektir; v57'de tam
      # bu durumda "PASS" verilmisti).
      # NE OLCULMUYOR: ekranin dogru cizildigi. Olculdu (WP-602): GDI Flutter'in
      # DirectComposition yuzeyini yakalayamiyor, uretilen PNG bos. Kapinin
      # gecerli sinyali basliktir; ekran goruntusu kanit degildir.
      #
      # Iki deneme: soguk baslangicta 10 sn'lik pencere (betigin ust siniri)
      # runner'da dar kalabilir. Ikisi de basarisizsa is KIRMIZI duser.
      - name: Yayınlanan ZIP gerçekten açılıyor mu (windows_fast_smoke)
        id: zipsmoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $extract = Join-Path $env:RUNNER_TEMP 'wp614-zip-smoke'
          if (Test-Path -LiteralPath $extract) { Remove-Item -Recurse -Force -LiteralPath $extract }
          Expand-Archive -LiteralPath '${{ steps.zip.outputs.zip }}' -DestinationPath $extract -Force
          $exe = Join-Path $extract 'online_study_room.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Yayinlanacak ZIP icinden uygulama cikmadi: $exe" }
          $shot = Join-Path $extract 'wp614-zip-smoke.png'
          $ok = $false
          $lastError = ''
          for ($attempt = 1; $attempt -le 2 -and -not $ok; $attempt++) {
            try {
              # 🔴 WP-640 — BETIK AYRI BIR SUREC OLARAK CAGRILIR.
              # Eski hali `& ../scripts/windows_fast_smoke.ps1 ...` idi: bu,
              # betigi ayni pwsh oturumunda kosturur ve `$LASTEXITCODE`'a
              # DOKUNMAZ (o degisken yalnizca native surecler icin yazilir).
              # Basarili kosumda degisken `$null` kaliyor, `$null -ne 0` dogru
              # oluyor ve kapi HER SEFERINDE firlatiyordu. Bedeli: v63 ve v64
              # Windows paketi, ZIP gercekten acildigi halde (loglarda iki kez
              # `WINDOWS_FAST_SMOKE PASS`, pencere 1024x720, baslik `Focus Camp`)
              # yayindan dusuruldu. Kirilan uygulama degil KAPININ KENDISIYDI.
              # `-File` ile cagirinca okunan sey gercek surec cikis kodudur.
              & pwsh -NoProfile -NonInteractive -File ../scripts/windows_fast_smoke.ps1 -ExecutablePath $exe -OutputPath $shot -TimeoutSeconds 10 -CloseAfter
              $code = $LASTEXITCODE
              # Fail-closed: cikis kodu okunamiyorsa (yani ayni-oturum
              # cagrisina geri donulmusse) kapi YINE kirmizi duser — sessizce
              # yesile donmez.
              if ($null -eq $code -or $code -ne 0) { throw "windows_fast_smoke.ps1 exit '$code'" }
              $ok = $true
            }
            catch {
              $lastError = $_.Exception.Message
              Write-Host "::warning title=ZIP smoke denemesi $attempt basarisiz::$lastError"
            }
          }
          if (-not $ok) { throw "Yayinlanacak ZIP acilmiyor; bu paket kullaniciya gonderilemez. Son hata: $lastError" }
          "passed=true" >> $env:GITHUB_OUTPUT

      # 🔴 WP-614 — MAGAZA PAKETI AYRI DERLENIR.
      # `--store` yalnizca PAKETLEMEYI degistiriyordu; kanal define'i hala
      # `windows` oldugu icin Microsoft Store'dan kuran kullaniciya "yeni surum
      # var, ZIP indir" diyalogu cikiyordu. Bu hem magaza kurali ihlali hem de
      # kullaniciyi bozuk bir yola sokan bir hata (magaza paketi kendini o
      # ZIP'le guncelleyemez).
      #
      # Neden IKINCI derleme: `DISTRIBUTION_CHANNEL` derleme zamaninda gomulur.
      # Tek derlemeden hem magaza hem sideload paketi cikarmak, ikisinden
      # birine yanlis politikayi dayatmak demektir — ZIP kullanicisi
      # guncellemesiz kalirdi. Ek maliyet yalnizca Store modu ACIKKEN olusur.
      - name: Store derlemesi (mağaza kanalı — sideload updater KAPALI)
        if: steps.msix.outputs.store_mode == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -LiteralPath env.json -Raw | ConvertFrom-Json
          $manifest.DISTRIBUTION_CHANNEL = 'microsoftStore'
          $manifest | ConvertTo-Json | Set-Content -LiteralPath env.json -Encoding utf8
          $written = (Get-Content -LiteralPath env.json -Raw | ConvertFrom-Json).DISTRIBUTION_CHANNEL
          if ($written -ne 'microsoftStore') { throw "Store manifesti yazilamadi: $written" }
          flutter test test/core/current_build_manifest_gate_test.dart test/core/config/distribution_define_wp614_test.dart --dart-define-from-file=env.json --dart-define=ENFORCE_CURRENT_BUILD_MANIFEST=true
          if ($LASTEXITCODE -ne 0) { throw 'Store derlemesi kanal sozlesmesini gecemedi; magaza paketi uretilmedi.' }
          flutter build windows --release --build-name=${{ inputs.version_name }} --build-number=${{ inputs.build_number }} --dart-define-from-file=env.json
          if ($LASTEXITCODE -ne 0) { throw 'Store derlemesi basarisiz.' }
          Write-Host '::notice title=Store derlemesi::Magaza paketi microsoftStore kanaliyla derlendi; sideload updater kapali.'

      - name: MSIX üret ve paketi doğrula
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $storeMode = '${{ steps.msix.outputs.store_mode }}' -eq 'true'
          # 🔴 WP-664: burası eskiden KOŞULSUZ 'Odak Kampı' yazıyordu. Store
          # modu ilk açıldığında paket, Partner Center'da rezerve edilmemiş bir
          # adla üretilecekti (sahip mağazada 'Focus Camp' rezerve etti) ve
          # gönderim reddedilirdi — üstelik bütün sürüm koşumu bittikten SONRA.
          $display = if ($storeMode) {
            '${{ steps.msix.outputs.store_app_name }}'
          } elseif ('${{ inputs.channel }}' -eq 'beta') { 'Odak Kampı (Beta)' } else { 'Odak Kampı' }
          # 🔴 Bu adım eskiden pubspec.yaml'ı yerinde regex ile
          # DEĞİŞTİRİYORDU. İki sorun: (1) paylaşılan sıcak dosyaya derleme
          # ortasında yazmak, (2) aynı build numarası ikinci kez koşturulduğunda
          # metin zaten hedef değere eşit olduğu için "msix_version bulunamadı"
          # diye YANLIŞ KIRMIZI dönmek. `msix` bu değerleri komut satırından da
          # alır (msix 3.18 configuration.dart: --version / --identity-name /
          # --display-name pubspec'i ezer); pubspec'e dokunmuyoruz ve
          # dokunmadığımızı hash ile kanıtlıyoruz.
          $pubspecBefore = (Get-FileHash pubspec.yaml -Algorithm SHA256).Hash
          # 🔴 WP-597: Store modunda kimlik ve yayıncı Partner Center'dan gelir;
          # `--store` paketi imzalamaz (Store'a yüklenen paket İMZASIZ olmalı,
          # imzayı Microsoft sertifikasyondan sonra kendisi atar).
          $expectedIdentity = if ($storeMode) { '${{ steps.msix.outputs.store_identity }}' } else { '${{ steps.msix.outputs.identity }}' }
          if ($storeMode) {
            dart run msix:create --build-windows false --store --version '${{ steps.msix.outputs.version }}' --identity-name $expectedIdentity --publisher '${{ steps.msix.outputs.store_publisher }}' --publisher-display-name '${{ steps.msix.outputs.store_display }}' --display-name $display
          } else {
            dart run msix:create --build-windows false --version '${{ steps.msix.outputs.version }}' --identity-name $expectedIdentity --display-name $display
          }
          if ($LASTEXITCODE -ne 0) { throw "msix:create başarısız (exit $LASTEXITCODE)." }
          if ((Get-FileHash pubspec.yaml -Algorithm SHA256).Hash -ne $pubspecBefore) { throw 'pubspec.yaml MSIX adımında değişti.' }

          $release = 'build/windows/x64/runner/Release'
          $msix = Get-ChildItem -Path $release -Filter *.msix -File | Select-Object -First 1
          if (-not $msix) { throw 'Zorunlu MSIX artefaktı üretilemedi.' }

          # Bayrakların gerçekten pakete işlendiğini paketin KENDİSİNDEN oku;
          # sessizce yok sayılan bir bayrak yanlış kimlikli paket üretir.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($msix.FullName)
          try {
            $entry = $archive.GetEntry('AppxManifest.xml')
            if (-not $entry) { throw 'MSIX içinde AppxManifest.xml yok.' }
            $reader = New-Object IO.StreamReader($entry.Open())
            try { $appxManifest = [xml]$reader.ReadToEnd() } finally { $reader.Dispose() }
          } finally { $archive.Dispose() }

          $packageIdentity = $appxManifest.Package.Identity
          if ($packageIdentity.Name -ne $expectedIdentity) { throw "Paket kimliği beklenenden farklı: $($packageIdentity.Name)" }
          if ($packageIdentity.Version -ne '${{ steps.msix.outputs.version }}') { throw "Paket sürümü beklenenden farklı: $($packageIdentity.Version)" }
          if ($storeMode -and $packageIdentity.Publisher -ne '${{ steps.msix.outputs.store_publisher }}') { throw "Store paketinin yayıncısı Partner Center Publisher ID'siyle eşleşmiyor: $($packageIdentity.Publisher)" }

          # 🔴 WP-664: adı bayrağa verdik diye pakete GİRDİĞİNİ varsaymıyoruz.
          # Partner Center'ın reddettiği şey manifestteki addır, komut
          # satırındaki değil; sessizce yok sayılan bir bayrak de aynı sonucu
          # verir. Bu iddia yanlış adı CI'da yakalar, gönderimde değil.
          $packageDisplayName = $appxManifest.Package.Properties.DisplayName
          if ($storeMode -and $packageDisplayName -ne '${{ steps.msix.outputs.store_app_name }}') { throw "Store paketindeki uygulama adı rezerve adla eşleşmiyor: '$packageDisplayName' (beklenen '${{ steps.msix.outputs.store_app_name }}')" }

          # 🔴 İMZA GERÇEĞİ. `msix_config`e sertifika verilmediğinde paket,
          # pub.dev'de herkese açık dağıtılan test sertifikasıyla (parola 1234)
          # imzalanır ve pubspec'teki `publisher` değeri bu özneyle EZİLİR.
          # Böyle imzalanmış paketi kullanıcı KURAMAZ: Windows güvenilmeyen
          # zinciri 0x800B010A ile reddeder — bu bir SmartScreen uyarısı değil,
          # sert bloktur.
          #
          # 🔴 WP-590: bu kapı eskiden `throw` ediyordu. `throw` paketleme
          # adımından ÖNCE olduğu için iş orada ölüyor, `upload-artifact` hiç
          # koşmuyordu; yani KURULABİLEN taşınabilir ZIP de yayınlanmıyordu.
          # Kırık olan MSIX'tir, ZIP değil. Kapı artık işi düşürmez: yalnız
          # MSIX'i yayından ALIKOYAR, sebebi manifeste ve koşum uyarısına yazar.
          $testPublisher = 'CN=Msix Testing, O=Msix Testing Corporation, S=Some-State, C=US'
          $trusted = $packageIdentity.Publisher -ne $testPublisher
          $publishMsix = $true
          $withheldReason = ''
          # 🔴 WP-597: Store paketi İMZASIZDIR ve bu kasıtlıdır — imzayı
          # Microsoft sertifikasyondan sonra atar. Böyle bir paketi herkese açık
          # indirme olarak yayınlamak WP-590'ın düzelttiği hatanın AYNISINI
          # tekrarlardı: kullanıcı indirir, kuramaz. Store paketi yalnız Partner
          # Center'a yüklenmek üzere AYRI bir artefakta gider; GitHub Release
          # varlıklarına ASLA girmez.
          if ($storeMode) {
            $publishMsix = $false
            $withheldReason = 'Store paketi imzasızdır (imzayı Microsoft atar); kullanıcı onu doğrudan kuramaz. GitHub Release yerine `windows-store-package` artefaktına konuldu; Partner Center''a oradan yüklenir.'
            Write-Host "::notice title=Store paketi ayrıldı::$withheldReason"
          }
          elseif (-not $trusted -and '${{ inputs.channel }}' -eq 'stable') {
            if ('${{ vars.WINDOWS_ALLOW_TEST_SIGNING }}' -eq 'true') {
              Write-Host '::warning title=Windows imzası güvenilmez::Stable MSIX herkese açık test sertifikasıyla imzalı; WINDOWS_ALLOW_TEST_SIGNING=true verildiği için BİLEREK yayınlanıyor. Kullanıcı bu paketi 0x800B010A ile kuramaz.'
            } else {
              $publishMsix = $false
              $withheldReason = 'Stable MSIX herkese açık test sertifikasıyla imzalanmış; kullanıcı onu 0x800B010A ile kuramaz. Bu yüzden MSIX YAYINLANMADI, taşınabilir ZIP yayınlandı. Gerçek kod imzası ekle veya WINDOWS_ALLOW_TEST_SIGNING=true ile bilerek onayla (docs/WINDOWS-RELEASE-GATE.md).'
              Write-Host "::warning title=Windows MSIX yayınlanmadı::$withheldReason"
            }
          }
          "publisher=$($packageIdentity.Publisher)" >> $env:GITHUB_OUTPUT
          "trusted=$($trusted.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "msix_published=$($publishMsix.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "withheld_reason=$withheldReason" >> $env:GITHUB_OUTPUT

      - name: Zorunlu Windows artefaktlarını paketle
        shell: pwsh
        env:
          # Sebep metni tırnak/karakter kaçışına takılmasın diye adım gövdesine
          # `${{ }}` ile değil ortam değişkeniyle giriyor.
          MSIX_PUBLISHED: ${{ steps.package.outputs.msix_published }}
          MSIX_WITHHELD_REASON: ${{ steps.package.outputs.withheld_reason }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'build/windows-dist'; New-Item -ItemType Directory -Force -Path $out | Out-Null
          $release = 'build/windows/x64/runner/Release'
          $msix = Get-ChildItem -Path $release -Filter *.msix -File | Select-Object -First 1
          if (-not $msix) { throw 'Zorunlu MSIX artefaktı üretilemedi.' }
          $prefix = '${{ steps.msix.outputs.prefix }}'
          # 🔴 WP-590 + WP-614: taşınabilir ZIP KOŞULSUZ üretilir ve yayınlanır —
          # kullanıcıda gerçekten çalışan tek Windows artefaktı odur. Üretimi
          # yukarıdaki ayrı adıma taşındı (Store derlemesi Release klasörünü
          # ezmeden ÖNCE alınmalı); burada yalnız varlığı fail-closed doğrulanır.
          # MSIX ise yalnız imzası güvenilirken (veya WINDOWS_ALLOW_TEST_SIGNING
          # ile bilerek onaylanmışken) dağıtım klasörüne kopyalanır.
          $zipOut = Join-Path $out "$prefix.zip"
          if (-not (Test-Path -LiteralPath $zipOut)) { throw "Tasinabilir ZIP uretilmemis: $zipOut" }
          $published = @($zipOut)
          if ($env:MSIX_PUBLISHED -eq 'true') { $msixOut = Join-Path $out "$prefix.msix"; Copy-Item $msix.FullName $msixOut; $published += $msixOut }
          # 🔴 WP-597: Store paketi AYRI klasöre gider. `$out` klasörünün tamamı
          # GitHub Release'e yükleniyor; imzasız Store paketini oraya koymak
          # kullanıcıya kuramayacağı bir dosya sunmak olurdu.
          if ('${{ steps.msix.outputs.store_mode }}' -eq 'true') {
            $storeOut = 'build/windows-store'; New-Item -ItemType Directory -Force -Path $storeOut | Out-Null
            Copy-Item $msix.FullName (Join-Path $storeOut "$prefix-store.msix")
          }
          $items = @($published | ForEach-Object {
            $name = Split-Path $_ -Leaf; $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()
            Set-Content "$_.sha256" -Value "$hash  $name" -NoNewline
            @{ name = $name; sha256 = $hash }
          })
          # 🔴 WP-614: manifest artik HANGI KANALLA derlendigini de tasiyor.
          # "Store paketi magaza kanaliyla mi cikti" sorusu yayindan sonra
          # hatirlamaya birakilamaz; `zipSmokePassed` de ZIP'in bir kez
          # gercekten acildiginin kaydidir.
          $storeMode = ('${{ steps.msix.outputs.store_mode }}' -eq 'true')
          $distribution = @{ zip = 'windows'; storePackage = $(if ($storeMode) { 'microsoftStore' } else { '' }); zipSmokePassed = ('${{ steps.zipsmoke.outputs.passed }}' -eq 'true') }
          @{ schemaVersion = 1; platform = 'windows'; status = 'complete'; channel = '${{ inputs.channel }}'; gitCommitSha = '${{ inputs.git_sha }}'; migrationHead = '${{ inputs.migration_head }}'; identityName = '${{ steps.msix.outputs.identity }}'; packageVersion = '${{ steps.msix.outputs.version }}'; distribution = $distribution; signing = @{ publisher = '${{ steps.package.outputs.publisher }}'; trusted = ('${{ steps.package.outputs.trusted }}' -eq 'true'); msixPublished = ($env:MSIX_PUBLISHED -eq 'true'); msixWithheldReason = [string]$env:MSIX_WITHHELD_REASON; storeMode = $storeMode }; artifacts = $items } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $out 'platform-manifest.json') -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: app/build/windows-dist/*
          if-no-files-found: error

      # 🔴 WP-597: Store paketi AYRI artefakt. Bu artefakt GitHub Release'e
      # girmez; sahibi indirip Partner Center'a yükler (docs/WINDOWS-STORE-YOLU.md).
      # Store modu kapalıyken klasör hiç oluşmaz, bu yüzden `if-no-files-found`
      # `ignore` — aksi halde Store'suz her koşum kırmızıya düşerdi.
      - uses: actions/upload-artifact@v4
        if: steps.msix.outputs.store_mode == 'true'
        with:
          name: windows-store-package
          path: app/build/windows-store/*
          if-no-files-found: error
