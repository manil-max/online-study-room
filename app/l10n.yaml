arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
preferred-supported-locales:
  # WP-457 release contract: generator/runtime order is exactly EN, then TR.
  # DE/AR sources live in lib/l10n_dormant and are not release inputs.
  - en
  - tr
nullable-getter: false
required-resource-attributes: true
format: true
untranslated-messages-file: l10n_untranslated.json
